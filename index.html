<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1A3057" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OM Gesprekken" />
  <title>OM Gesprekken</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F6F2EA; color: #1C1C1C; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    textarea, input, button { font-family: 'Inter', system-ui, sans-serif; }
    textarea:focus, input:focus { outline: none; border-color: #1A3057 !important; box-shadow: 0 0 0 3px rgba(26,48,87,0.12) !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #D5CFBF; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── COLORS ───────────────────────────────────────────────────────────────
    const C = {
      navy:'#1A3057', navyDk:'#0F1E38', navyLt:'#2A4A7F',
      cream:'#F6F2EA', creamDk:'#EDE8DF',
      border:'#D5CFBF', gold:'#A67C00',
      text:'#1C1C1C', mid:'#555', light:'#888',
      green:'#2D6A4F', orange:'#B85C00', red:'#8B1A1A',
      white:'#FFFFFF',
    };

    // ─── STORAGE (localStorage) ───────────────────────────────────────────────
    const store = {
      loadGesprekken:  () => { try { return JSON.parse(localStorage.getItem('om-gesprekken') || '[]'); } catch { return []; } },
      saveGesprekken:  (d) => { try { localStorage.setItem('om-gesprekken', JSON.stringify(d)); } catch {} },
      loadContext:     () => { try { return JSON.parse(localStorage.getItem('om-context') || '[]'); } catch { return []; } },
      saveContext:     (d) => { try { localStorage.setItem('om-context', JSON.stringify(d)); } catch {} },
      loadOverleggen:  () => { try { return JSON.parse(localStorage.getItem('om-overleggen') || 'null'); } catch { return null; } },
      saveOverleggen:  (d) => { try { localStorage.setItem('om-overleggen', JSON.stringify(d)); } catch {} },
      getApiKey:       () => localStorage.getItem('om-api-key') || '',
      setApiKey:       (k) => localStorage.setItem('om-api-key', k),
    };

    // ─── CLAUDE API ───────────────────────────────────────────────────────────
    async function claude(messages, system, apiKey) {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 8000, system, messages }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message);
      return d.content?.map(b => b.text || '').join('\n') || '';
    }

    // ─── TEMPLATES ────────────────────────────────────────────────────────────
    const TPL_A = [
      { id:'p', title:'01 · Persoonlijk', hint:'Begin zelf — deel iets persoonlijks voordat je het vraagt', fields:[
        { id:'pers_ach', label:'Achtergrond & loopbaan', rows:3 },
        { id:'pers_stijl', label:'Werkstijl & energie — wat past, wat absoluut niet', rows:3 },
      ]},
      { id:'w', title:'02 · Werk en rol', hint:'Let op rolduidelijkheid: weet iemand wat er van hem/haar verwacht wordt?', fields:[
        { id:'werk_uitleg', label:'Hoe legt iemand zijn werk uit aan iemand buiten het werk', rows:3 },
        { id:'werk_sterk', label:'Sterktes — wat zou de afdeling missen', rows:2 },
        { id:'werk_energ', label:'Energiegevers versus energievreters', rows:3 },
      ]},
      { id:'s', title:'03 · Samenwerking', hint:'Silovorming en frictiegebieden zitten hier tussen de regels', fields:[
        { id:'sw_wie', label:'Met wie samengewerkt, hoe loopt dat', rows:3 },
        { id:'sw_loopt', label:'Wat gaat vanzelf — wat kost elke keer moeite', rows:3 },
        { id:'sw_zoekt', label:'Wie zoekt wie op', rows:2 },
      ]},
      { id:'b', title:'04 · Buiten en behoeften', hint:'Reactief of pro-actief patroon? Wie stuurt de agenda?', fields:[
        { id:'buit_sh', label:'Stakeholders — weten die wat hij/zij voor ze kan doen', rows:3 },
        { id:'buit_waarde', label:'Wanneer is er echt toegevoegde waarde — en wanneer niet', rows:3 },
      ]},
      { id:'a', title:'05 · De afdeling als geheel', hint:'De goudvraag aan het einde is het meest waardevol', fields:[
        { id:'afd_goed', label:'Wat gaat goed / wat koesteren', rows:2 },
        { id:'afd_anders', label:'Wat anders zou moeten', rows:3 },
        { id:'afd_nodig', label:'Wat heeft hij/zij nodig om werk echt goed te doen', rows:2 },
        { id:'afd_goud', label:'Goudvraag — wat ga ik onderschatten of niet meteen snappen', rows:3 },
      ]},
    ];

    const TPL_B = [
      { id:'c', title:'01 · Hun werk en context', hint:'Niet over jouw afdeling beginnen — eerst hun wereld begrijpen', fields:[
        { id:'b_druk', label:'Grootste uitdagingen op dit moment — waar zit de druk', rows:3 },
        { id:'b_jaar', label:'Wat moet er over een jaar beter zijn dan nu', rows:3 },
      ]},
      { id:'r', title:'02 · Raakvlakken met jouw afdeling', hint:'Latente behoeften zitten zelden in wat mensen spontaan noemen — doorvragen', fields:[
        { id:'b_gebruik', label:'Waar maken ze gebruik van de afdeling — of zouden ze dat willen', rows:3 },
        { id:'b_stokt', label:'Wat gaat goed — wat stokt', rows:3 },
        { id:'b_latent', label:'Latente behoeften — wat willen ze maar vragen ze niet om, waarom niet', rows:4 },
        { id:'b_gemist', label:'Wat hebben ze weleens gezocht en niet gevonden', rows:3 },
      ]},
      { id:'pe', title:'03 · Perceptie van de afdeling', hint:'Niet aanvechten of verdedigen — gewoon opnemen', fields:[
        { id:'b_omschr', label:'Hoe omschrijven ze de afdeling aan een collega die er weinig van weet', rows:3 },
        { id:'b_verwacht', label:'Wat verwachten ze — en wat juist niet', rows:3 },
        { id:'b_verander', label:'Als ze één ding zouden veranderen aan hoe de afdeling werkt — wat dan', rows:3 },
      ]},
    ];

    const DIAG_A = [
      { id:'diag_rol',   label:'Rolduidelijkheid',    opts:['Helder','Vaag','Onduidelijk'],               colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_ori',   label:'Oriëntatie',           opts:['Buitengericht','Gemengd','Binnengericht'],   colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_eigen', label:'Eigenaarschap',        opts:['Sterk','Wisselend','Afwachtend'],            colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_inv',   label:'Informele invloed',    opts:['Ja','Deels','Nee'],                          colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_toon',  label:'Toon gesprek',         opts:['Positief','Neutraal','Kritisch','Gesloten'], colors:['#2D6A4F','#666','#B85C00','#8B1A1A'] },
    ];

    const DIAG_B = [
      { id:'diag_kent',  label:'Kent afdeling goed?',           opts:['Ja','Gedeeltelijk','Nauwelijks'], colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_react', label:'Afdeling reactief of pro-actief?', opts:['Pro-actief','Wisselend','Reactief'], colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_toon',  label:'Toon gesprek',                  opts:['Positief','Neutraal','Kritisch'],  colors:['#2D6A4F','#666','#8B1A1A'] },
    ];

    const TPL_PL = [
      { id:'strat', title:'01 · Strategische positie B&S', hint:"Geef ruimte — deze vragen zijn waarschijnlijk nog nooit zo gesteld. Als het antwoord vaag is: 'Wat zou het parket concreet missen als B&S er niet was?'", fields:[
        { id:'pl_waarom',  label:'Waarom bestaat B&S — wat voegt de afdeling toe aan het parket?', rows:4 },
        { id:'pl_missen',  label:'Wat zou het parket missen als B&S er niet was?', rows:3 },
        { id:'pl_rol',     label:'Wat is de strategische functie die u van B&S verwacht — niet de taken, maar de rol?', rows:4 },
      ]},
      { id:'mandaat', title:'02 · Mandaat en bevoegdheden', hint:'Zonder mandaat kan B&S niet pro-actief zijn. Dit bepaalt of verandering ook echt mogelijk is.', fields:[
        { id:'pl_bevoegd',  label:'Welke bevoegdheden en welk mandaat heeft B&S nodig om die rol waar te maken?', rows:4 },
        { id:'pl_grenzen',  label:'Waar liggen de grenzen — wat valt buiten het mandaat van B&S?', rows:3 },
        { id:'pl_verhouding', label:'Hoe verhoudt B&S zich tot andere afdelingen die raakvlakken hebben met deze rol?', rows:3 },
      ]},
      { id:'resultaat', title:'03 · Gewenst resultaat', hint:'', fields:[
        { id:'pl_succes',  label:'Wat zou u over een jaar zien dat u vertelt dat het gelukt is?', rows:4 },
        { id:'pl_verschil', label:'Wat is het verschil tussen B&S nu en B&S zoals u het voor ogen heeft?', rows:4 },
        { id:'pl_weten',   label:'Zijn er zaken die u heeft gehoord of gezien die ik moet weten voor mijn diagnose?', rows:3 },
      ]},
      { id:'hyp', title:'04 · Toetsing functionele hypothese', hint:'Leg de drie elementen voor als hypothese — niet als voorstel. Luister of de parketleiding ze herkent, aanvult of verwerpt. Het antwoord bepaalt het DECIDE-moment.', fields:[
        { id:'hyp_staf', label:'B&S als staf voor de parketleiding — bestuursondersteuning, parketbrede beleidsadvisering, communicatie. Herkent u dat als kern van wat u van B&S verwacht?', rows:4 },
        { id:'hyp_teams', label:'B&S als beleidsmatige ondersteuning dicht op de operationele teams — thematisch, op onderwerpen die de grenzen van één team overstijgen. Is dat wat teamleiders en rechercheofficieren van B&S mogen verwachten — of hoort dat elders thuis?', rows:4 },
        { id:'hyp_verwerving', label:'B&S als bewaker van de verwervingsstrategie als geheel — niet zelf verwerven maar bewaken dat parallelle inspanningen samen kloppen binnen het productiekader. Wie is daar nu eigenaar van — en zou dat B&S moeten zijn?', rows:4 },
        { id:'hyp_reactie', label:'Reactie op de hypothese als geheel — wat herkent men, wat niet, wat ontbreekt volgens de parketleiding om dit waar te maken?', rows:5 },
      ]},
    ];

    const DIAG_PL = [
      { id:'diag_pl_strat',  label:'Strategische functie benoemd?', opts:['Helder','Deels','Niet'],    colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_pl_mandaat', label:'Mandaat expliciet?',           opts:['Ja','Deels','Nee'],          colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_pl_toon',   label:'Toon gesprek',                  opts:['Positief','Neutraal','Kritisch'], colors:['#2D6A4F','#666','#8B1A1A'] },
    ];

    const uid = () => Math.random().toString(36).slice(2,10);

    function gesprekToText(g) {
      const sections = g.type === 'medewerker' ? TPL_A : g.type === 'parketleiding' ? TPL_PL : TPL_B;
      const diags    = g.type === 'medewerker' ? DIAG_A : g.type === 'parketleiding' ? DIAG_PL : DIAG_B;
      let t = `=== ${g.type.toUpperCase()}: ${g.naam}${g.functie ? ` (${g.functie})` : ''}${g.cluster ? ` · ${g.cluster}` : ''} · ${g.datum} ===\n\n`;
      sections.forEach(s => {
        const body = s.fields.filter(f => g[f.id]?.trim()).map(f => `  ${f.label}:\n  ${g[f.id]}`).join('\n\n');
        if (body) t += `${s.title}\n${body}\n\n`;
      });
      const diag = diags.filter(f => g[f.id]).map(f => `${f.label}: ${g[f.id]}`).join('  |  ');
      if (diag) t += `Diagnose: ${diag}\n`;
      if (g.spontaan) t += `Spontaan genoemd: ${g.spontaan}\n`;
      if (g.regels) t += `Tussen de regels: ${g.regels}\n`;
      if (g.kernbev) t += `Kernbevindingen: ${g.kernbev}\n`;
      if (g.ontbreekt) t += `Wat ontbreekt nog: ${g.ontbreekt}\n`;
      if (g.frustratie) t += `Frustratie: ${g.frustratie}\n`;
      return t;
    }

    // ─── STYLES ───────────────────────────────────────────────────────────────
    const S = {
      app: { minHeight:'100vh', background:C.cream },
      hdr: { background:C.navy, color:C.white, padding:'0 20px', position:'sticky', top:0, zIndex:100, boxShadow:'0 2px 12px rgba(0,0,0,0.2)' },
      hdrIn: { maxWidth:900, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', height:56 },
      title: { fontFamily:"'Lora', Georgia, serif", fontSize:18, fontWeight:700, letterSpacing:'-0.3px' },
      sub: { fontSize:11, color:'rgba(255,255,255,0.5)', marginTop:1 },
      nav: { display:'flex', gap:4 },
      navBtn: (a) => ({ padding:'8px 14px', borderRadius:6, border:'none', cursor:'pointer', fontSize:13, fontWeight:500, background: a ? 'rgba(255,255,255,0.15)' : 'transparent', color: a ? C.white : 'rgba(255,255,255,0.6)', transition:'all 0.15s' }),
      main: { maxWidth:900, margin:'0 auto', padding:'24px 20px 80px' },
      card: { background:C.white, borderRadius:10, border:`1px solid ${C.border}`, padding:20, marginBottom:12, cursor:'pointer', transition:'box-shadow 0.15s', boxShadow:'0 1px 4px rgba(0,0,0,0.04)' },
      secTitle: { fontFamily:"'Lora', Georgia, serif", fontSize:22, fontWeight:700, color:C.navy, marginBottom:6 },
      label: { fontSize:13, fontWeight:600, color:C.navy, marginBottom:5, display:'block' },
      hint: { fontSize:12, color:C.orange, marginBottom:8, fontStyle:'italic' },
      ta: { width:'100%', border:`1px solid ${C.border}`, borderRadius:7, padding:'10px 12px', fontSize:14, color:C.text, background:C.white, resize:'vertical', lineHeight:1.6, transition:'border-color 0.15s, box-shadow 0.15s' },
      inp: { width:'100%', border:`1px solid ${C.border}`, borderRadius:7, padding:'10px 12px', fontSize:14, color:C.text, background:C.white, transition:'border-color 0.15s, box-shadow 0.15s' },
      btnP: { background:C.navy, color:C.white, border:'none', borderRadius:8, padding:'10px 22px', fontSize:14, fontWeight:600, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:6, transition:'opacity 0.15s' },
      btnS: { background:'transparent', color:C.navy, border:`1.5px solid ${C.navy}`, borderRadius:8, padding:'9px 20px', fontSize:14, fontWeight:600, cursor:'pointer', transition:'all 0.15s' },
      pill: (col) => ({ display:'inline-block', padding:'2px 10px', borderRadius:20, fontSize:11, fontWeight:600, background:col+'22', color:col, border:`1px solid ${col}44`, marginRight:4 }),
      secHdr: { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', background:C.navy, borderRadius:8, cursor:'pointer', userSelect:'none', marginBottom:0 },
      secHdrTxt: { fontFamily:"'Lora', Georgia, serif", fontSize:15, fontWeight:700, color:C.white },
      diagRow: { display:'flex', alignItems:'flex-start', gap:16, padding:'12px 0', borderBottom:`1px solid ${C.creamDk}` },
      diagLbl: { fontSize:13, fontWeight:600, color:C.navy, width:150, flexShrink:0, paddingTop:6 },
      diagOpts: { display:'flex', flexWrap:'wrap', gap:6 },
      optBtn: (sel, col) => ({ padding:'7px 14px', borderRadius:20, border:`1.5px solid ${sel ? col : C.border}`, background: sel ? col+'18' : C.white, color: sel ? col : C.mid, fontSize:13, fontWeight: sel ? 600 : 400, cursor:'pointer', transition:'all 0.1s' }),
      mcell: (col) => ({ width:22, height:22, borderRadius:4, background:col, display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:700, color:C.white, flexShrink:0 }),
      aiBox: { background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, whiteSpace:'pre-wrap', fontSize:14, lineHeight:1.8, color:C.text },
      empty: { textAlign:'center', padding:'60px 20px', color:C.light },
    };

    // ─── SMALL COMPONENTS ─────────────────────────────────────────────────────
    function Spinner() {
      return <span style={{ display:'inline-block', width:15, height:15, border:'2px solid rgba(255,255,255,0.35)', borderTopColor:C.white, borderRadius:'50%', animation:'spin 0.7s linear infinite' }} />;
    }

    function TypeBadge({ type }) {
      const color = type === 'medewerker' ? C.navyLt : type === 'parketleiding' ? C.green : C.gold;
      const label = type === 'medewerker' ? 'Medewerker' : type === 'parketleiding' ? 'Parketleiding' : 'Stakeholder';
      return <span style={S.pill(color)}>{label}</span>;
    }

    function Accordion({ title, hint, open, onToggle, children }) {
      return (
        <div style={{ marginBottom:16 }}>
          <div style={S.secHdr} onClick={onToggle}>
            <span style={S.secHdrTxt}>{title}</span>
            <span style={{ color:'rgba(255,255,255,0.7)', fontSize:18 }}>{open ? '−' : '+'}</span>
          </div>
          {open && (
            <div style={{ padding:'20px 0 4px', display:'flex', flexDirection:'column', gap:16 }} className="fade-in">
              {hint && <div style={S.hint}>💡 {hint}</div>}
              {children}
            </div>
          )}
        </div>
      );
    }

    // ─── SETUP SCREEN ─────────────────────────────────────────────────────────
    function SetupView({ onSave }) {
      const [key, setKey] = useState('');
      return (
        <div style={{ minHeight:'100vh', background:C.navy, display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div style={{ background:C.white, borderRadius:16, padding:40, maxWidth:440, width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
            <div style={{ fontFamily:"'Lora', Georgia, serif", fontSize:26, fontWeight:700, color:C.navy, marginBottom:8 }}>OM Gesprekken</div>
            <div style={{ fontSize:14, color:C.mid, marginBottom:28, lineHeight:1.6 }}>
              Om patronenanalyse en bevindingsnotities te genereren heb je een Anthropic API-sleutel nodig. Je sleutel wordt lokaal opgeslagen en nooit gedeeld.
            </div>
            <label style={S.label}>Anthropic API-sleutel</label>
            <input style={{ ...S.inp, marginBottom:8, fontFamily:'monospace', fontSize:13 }}
              type="password" placeholder="sk-ant-..." value={key} onChange={e => setKey(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && key.startsWith('sk-') && onSave(key)} />
            <div style={{ fontSize:12, color:C.light, marginBottom:24 }}>
              Haal je sleutel op via <a href="https://console.anthropic.com" target="_blank" style={{ color:C.navyLt }}>console.anthropic.com</a>
            </div>
            <button style={{ ...S.btnP, width:'100%', justifyContent:'center' }}
              onClick={() => key.startsWith('sk-') && onSave(key)} disabled={!key.startsWith('sk-')}>
              Opslaan en starten
            </button>
            <div style={{ marginTop:16, fontSize:12, color:C.light, textAlign:'center' }}>
              De app werkt ook zonder sleutel — alleen AI-functies zijn dan uitgeschakeld.
            </div>
            <button style={{ ...S.btnS, width:'100%', justifyContent:'center', marginTop:8, fontSize:13 }}
              onClick={() => onSave('')}>Verder zonder sleutel</button>
          </div>
        </div>
      );
    }

    // ─── GESPREKKEN LIST ──────────────────────────────────────────────────────
    function GesprekkenView({ gesprekken, onNew, onEdit, onDelete }) {
      const [search, setSearch] = useState('');
      const filtered = gesprekken.filter(g =>
        !search || [g.naam, g.functie, g.cluster].some(v => v?.toLowerCase().includes(search.toLowerCase()))
      );
      return (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
            <div>
              <div style={S.secTitle}>Gesprekken</div>
              <div style={{ fontSize:13, color:C.mid }}>
                {gesprekken.length} gesprekken · {gesprekken.filter(g => g.type==='medewerker').length} medewerkers · {gesprekken.filter(g => g.type==='stakeholder').length} stakeholders
              </div>
            </div>
            <button style={S.btnP} onClick={onNew}>+ Nieuw gesprek</button>
          </div>
          {gesprekken.length > 3 && (
            <input style={{ ...S.inp, marginBottom:16 }} placeholder="Zoeken…" value={search} onChange={e => setSearch(e.target.value)} />
          )}
          {filtered.length === 0 && (
            <div style={S.empty}>
              <div style={{ fontSize:40, marginBottom:12 }}>📋</div>
              <div style={{ fontSize:16, fontWeight:600, marginBottom:6 }}>Nog geen gesprekken</div>
              <div style={{ fontSize:14 }}>Voeg je eerste kennismakingsgesprek toe.</div>
            </div>
          )}
          {filtered.map(g => {
            const diags = g.type === 'medewerker' ? DIAG_A : DIAG_B;
            return (
              <div key={g.id} onClick={() => onEdit(g.id)}
                style={{ ...S.card, borderLeft:`3px solid ${g.type==='medewerker' ? C.navyLt : g.type==='parketleiding' ? C.green : C.gold}` }}
                onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'}

    // ─── GRAFIEKEN ────────────────────────────────────────────────────────────
    function DonutChart({ title, data, size = 140 }) {
      const total = data.reduce((s, d) => s + d.value, 0);
      if (total === 0) return null;
      const cx = size / 2, cy = size / 2, r = size * 0.36, inner = size * 0.22;
      let angle = -Math.PI / 2;
      const slices = data.filter(d => d.value > 0).map(d => {
        const start = angle;
        angle += (d.value / total) * 2 * Math.PI;
        return { ...d, start, end: angle };
      });

      const arc = (s, e, ro, ri) => {
        const x1 = cx + ro * Math.cos(s), y1 = cy + ro * Math.sin(s);
        const x2 = cx + ro * Math.cos(e), y2 = cy + ro * Math.sin(e);
        const x3 = cx + ri * Math.cos(e), y3 = cy + ri * Math.sin(e);
        const x4 = cx + ri * Math.cos(s), y4 = cy + ri * Math.sin(s);
        const large = e - s > Math.PI ? 1 : 0;
        return `M ${x1} ${y1} A ${ro} ${ro} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ri} ${ri} 0 ${large} 0 ${x4} ${y4} Z`;
      };

      return (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10 }}>
          <div style={{ fontFamily:"'Lora',serif", fontSize:13, fontWeight:700, color:C.navy, textAlign:'center' }}>{title}</div>
          <svg width={size} height={size}>
            {slices.map((s, i) => <path key={i} d={arc(s.start, s.end, r, inner)} fill={s.color} opacity={0.9} />)}
            <text x={cx} y={cy + 4} textAnchor="middle" fontSize={size * 0.14} fontWeight="700" fill={C.navy}>{total}</text>
          </svg>
          <div style={{ display:'flex', flexDirection:'column', gap:4, width:'100%' }}>
            {data.filter(d => d.value > 0).map((d, i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:6, fontSize:11 }}>
                <div style={{ width:10, height:10, borderRadius:2, background:d.color, flexShrink:0 }} />
                <span style={{ color:C.mid, flex:1 }}>{d.label}</span>
                <span style={{ fontWeight:700, color:C.navy }}>{d.value}</span>
                <span style={{ color:C.light }}>({Math.round(d.value/total*100)}%)</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BarChart({ title, groups }) {

    function DiagnoseNotitie({ diagnose, apiKey }) {
      const [notitie, setNotitie] = useState(() => {
        try { return localStorage.getItem('om-diagnose-notitie') || ''; } catch { return ''; }
      });
      const [history, setHistory] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');
      const [open, setOpen] = useState(false);

      const saveNotitie = (n) => {
        setNotitie(n);
        try { localStorage.setItem('om-diagnose-notitie', n); } catch {}
      };

      const SYS_NOTITIE = `Je schrijft een bevindingsnotitie voor een nieuw afdelingshoofd bij OM Parket Den Haag. Schrijf in het Nederlands. Analytisch, direct, geen ambtelijke taal, geen overbodige opsmuk. Maximaal 1 A4.

De notitie volgt altijd deze volgorde: eerst het conceptuele (waarvoor bestaat B&S), dan pas het structurele (of de inrichting klopt). Niet andersom.

De sturingsverantwoordelijkheid van de parketleiding krijgt een prominente positie — dit is geen puur intern probleem van B&S. Het parket heeft nagelaten te sturen op samenhang en aansluiting. Dat is onderdeel van de bevinding.

De notitie onderscheidt expliciet waar B&S leidend moet zijn (verwerving, woordvoering, informatiesturing) en waar dienend (klachtafhandeling, bestuursondersteuning, advies op verzoek). Zolang dat onderscheid niet gemaakt is, blijft de afdeling standaard reactief.

De notitie sluit af met de vraag wat nog getoetst moet worden voor het DECIDE-moment met de hoofdofficier — niet als actielijst maar als open vragen die fase 1 moet beantwoorden.

Geen actiepunten. Geen stappenplannen. Alleen bevindingen.`;

      const generate = async () => {
        if (!apiKey) { setErr('Geen API-sleutel.'); return; }
        setLoading(true); setErr(''); setOpen(true);
        try {
          const msgs = [{ role:'user', content:`Schrijf een scherpe, compacte notitie op basis van deze diagnose:\n\n${diagnose}\n\nDe notitie is een sturingsinstrument voor het afdelingshoofd zelf en als basis voor het DECIDE-gesprek met de hoofdofficier aan het einde van fase 1. Het is geen actieplan en geen stappenplan.\n\nStructuur:\n\n**De kern** (3-4 zinnen — wat is de essentie van de problematiek, direct geformuleerd)\n\n**Wat structureel anders moet** (4-6 punten — niet hoe, maar wat de gewenste toestand is per gebied)\n\n**Wat dit vraagt van de afdeling** (wat moet er anders in hoe de afdeling als geheel functioneert — cultuur, houding, werkwijze)\n\n**Wat dit van mij vraagt als afdelingshoofd** (wat is mijn rol, waar moet ik op sturen, wat vraagt dit van mijn leiderschap)\n\n**Wat ik daarvoor nodig heb** (van het parket, van de parketleiding, van andere afdelingen en leidinggevenden — wat is noodzakelijk om dit te kunnen realiseren)\n\n**Scenario-advies** (op basis van de diagnose: past scenario A, B of C het beste, en waarom — dit is input voor het gesprek met de hoofdofficier, geen opdracht aan hem)\n\nMaximaal 1,5 A4. Analytisch, direct, geen ambtelijke taal. Geen actielijsten.` }];
          const result = await claude(msgs, SYS_NOTITIE, apiKey);
          saveNotitie(result);
          setHistory([...msgs, { role:'assistant', content:result }]);
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      const refine = async () => {
        if (!input.trim() || !notitie || !apiKey) return;
        setLoading(true);
        const newH = [...history, { role:'user', content:input }];
        try {
          const result = await claude(newH, SYS_NOTITIE, apiKey);
          saveNotitie(result);
          setHistory([...newH, { role:'assistant', content:result }]);

            <div style={{ padding:'14px 18px', display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer' }}

              </div>
            </div>

                    </div>
                  </>
                )}

            )}

        </div>
      );

      { naam:'PvA Instroom', domein:'Inhoudelijk dossier', type:'Intern', frequentie:'Kwartaal', prioriteit:'Hoog', eigenaar:'Hanneke Franssen / Arthur Haijer', relaties:['RAO','Directieoverleg'], doel:'Integraal plan van aanpak instroom. Laatste update december 2025. Volgende update 1 april 2026. Bespreking in Directieoverleg en Ruitgesprek in juni.', deelnemers:'Hanneke Franssen, Arthur Haijer, Frank van Dijk', standVanZaken:'In concept voorbesproken met Frank. Hanneke bezig met update.', actiesNodig:'Update realiseren voor bespreking DO en Ruitgesprek juni', toelichting:'', toets:{} },

      { naam:'Toekomstbestendige basisteams', domein:'Inhoudelijk dossier', type:'Intern', frequentie:'Ad hoc', prioriteit:'Medium', eigenaar:'Thijs Berger / Jan Keijzer', relaties:[], doel:'Control maakt impactanalyse, bespreking MT 21 april. Vervolg monitoren.', deelnemers:'Jan Keijzer', standVanZaken:'Impactanalyse in voorbereiding.', actiesNodig:'Op MT 21 april. Strak vasthouden richting Jan Keijzer.', toelichting:'', toets:{} },
      { naam:'Doorontwikkeling integrale advisering', domein:'Inhoudelijk dossier', type:'Intern', frequentie:'Maandelijks', prioriteit:'Medium', eigenaar:'Aranka van Driel', relaties:[], doel:'Doorontwikkeling integrale bestuurlijke/beleidsadvisering. Stappen op proces, ontwikkeling medewerkers, organisatie en sturing. Periodiek besproken met Frank.', deelnemers:'Frank van Dijk, Aranka van Driel', standVanZaken:'Concrete stappen: op orde krijgen processen driehoek DH, RBO, OMKP en PMO.', actiesNodig:'Vervolgstappen bepalen met Frank', toelichting:'', toets:{} },
      { naam:'Verzakelijking B&S', domein:'Inhoudelijk dossier', type:'Intern', frequentie:'Ad hoc', prioriteit:'Laag', eigenaar:'Aranka van Driel / nieuw afdelingshoofd', relaties:[], doel:'Overzicht externe overleggen op H-schijf. Volgende stap: in gesprek met clusters kijken of alle overleggen nog nodig zijn.', deelnemers:'Clusterleiders', standVanZaken:'Overzicht bestaat.', actiesNodig:'Bespreken met clusters', toelichting:'', toets:{} },
      { naam:'Buikpijnzaken', domein:'Inhoudelijk dossier', type:'Intern', frequentie:'Ad hoc', prioriteit:'Medium', eigenaar:'Thijs Berger', relaties:[], doel:'Zaken waarin interne tijdlijn wordt opgesteld. Evaluatie afgesproken met Margreet. Auke: geen expliciete leerpunten uit recente zaken.', deelnemers:'Auke, Margreet', standVanZaken:'Terugkoppeling aan afstemmingsoverleg nog te doen.', actiesNodig:'Terugkoppeling aan afstemmingsoverleg. Overwegen of besluit tot tijdlijn steeds terecht wordt genomen.', toelichting:'', toets:{} },
    ].map(o => ({ ...o, id: Math.random().toString(36).slice(2,10) }));

    const TOETS_VRAGEN = [
      { id:'resultaat', label:'Levert dit overleg een concreet resultaat op?' },
      { id:'eigenaar',  label:'Is er een eigenaar die zich er echt aan committeert?' },
      { id:'gemist',    label:'Zou het parket iets missen als dit overleg wegvalt?' },
    ];

    function OverleggenView({ overleggen, onOverleggenChange, apiKey }) {
      const [tab, setTab] = useState('inventaris');
      const [netwerkTab, setNetwerkTab] = useState('graph');
      const [editing, setEditing] = useState(null);
      const [aiText, setAiText] = useState('');
      const [aiLoading, setAiLoading] = useState(false);
      const [aiErr, setAiErr] = useState('');
      const namen = overleggen.map(o => o.naam);

      const update = (id, field, val) => onOverleggenChange(overleggen.map(o => o.id === id ? { ...o, [field]: val } : o));
      const updateToets = (id, vId, val) => onOverleggenChange(overleggen.map(o => o.id === id ? { ...o, toets: { ...o.toets, [vId]: val } } : o));
      const addOverleg = () => {
        const n = { id: uid(), naam:'Nieuw overleg', domein:'Overleg', type:'Intern', frequentie:'Ad hoc', prioriteit:'Medium', eigenaar:'', relaties:[], doel:'', deelnemers:'', standVanZaken:'', actiesNodig:'', toelichting:'', toets:{} };
        onOverleggenChange([...overleggen, n]);
        setEditing(n.id);
      };
      const del = (id) => { if(window.confirm('Overleg verwijderen?')) onOverleggenChange(overleggen.filter(o => o.id !== id)); };

      const toetsTotaal = (o) => {
        const vals = Object.values(o.toets || {});
        if (!vals.length) return null;
        if (vals.every(v => v === 'Ja')) return 'Ja';
        if (vals.some(v => v === 'Nee')) return 'Nee';
        return 'Deels';
      };

      const analyzeAI = async () => {
        if (!apiKey) { setAiErr('Geen API-sleutel.'); return; }
        setAiLoading(true); setAiErr('');
        const tekst = overleggen.map(o => {
          const t = toetsTotaal(o);
          return `${o.naam} | ${o.type} | ${o.frequentie} | Prio: ${o.prioriteit} | Eigenaar: ${o.eigenaar || '?'} | Relaties: ${o.relaties.join(', ')||'geen'} | Toetsing: ${t||'niet gedaan'}`;
        }).join('\n');
        try {
          const result = await claude([{ role:'user', content:`Analyseer de overlegstructuur van afdeling B&S bij OM Parket Den Haag:\n\n${tekst}\n\nBeantwoord:\n1. Welke overleggen staan centraal — veel verbindingen, hoog risico als ze wegvallen?\n2. Welke overleggen zijn geïsoleerd — mogelijk overbodig?\n3. Waar lopen intern en extern door elkaar — rolvervaging?\n4. Welke overleggen bedienen hetzelfde doel maar zijn apart georganiseerd?\n5. Wat ontbreekt gezien de diagnosebevindingen over B&S?\n6. Welke overleggen hebben geen eigenaar of onduidelijk eigenaarschap?\n\nAnalytisch, direct, geen ambtelijke taal.` }],
            `Je analyseert de overlegstructuur van afdeling B&S bij OM Parket Den Haag. Schrijf in het Nederlands. Analytisch, direct, geen ambtelijke taal. De afdeling heeft vijf clusters: beleidsondersteuning & advies, gebiedsgericht werken, intelligence & ondermijning, communicatie, en bureau juridische zaken.`,
            apiKey);
          setAiText(result);
        } catch(e) { setAiErr(e.message); }
        setAiLoading(false);
      };

      return (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
            <div>
              <div style={S.secTitle}>Overleggen</div>
              <div style={{ fontSize:13, color:C.mid }}>{overleggen.length} overleggen</div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              <button style={S.btnS} onClick={() => {
                const bestaandeNamen = overleggen.map(o => o.naam.toLowerCase().trim());
                const toe = START_OVERLEGGEN.filter(s => !bestaandeNamen.includes(s.naam.toLowerCase().trim()));
                if (toe.length === 0) { alert('Alle overleggen uit de overdracht staan er al in.'); return; }
                if (window.confirm(`${toe.length} ontbrekende overleggen toevoegen uit de overdracht van Lodewijk?`)) {
                  onOverleggenChange([...overleggen, ...toe.map(o => ({ ...o, id: uid() }))]);
                }
              }}>+ Laad uit overdracht</button>
              <button style={S.btnP} onClick={addOverleg}>+ Nieuw overleg</button>
            </div>
          </div>

          <div style={{ display:'flex', gap:8, marginBottom:20 }}>
            {[['inventaris','📋 Inventarisatie'],['toetsing','✅ Toetsing'],['netwerk','🔗 Netwerk']].map(([id,lbl]) => (
              <button key={id} onClick={() => setTab(id)}
                style={{ ...S.btnS, background: tab===id ? C.navy : 'transparent', color: tab===id ? C.white : C.navy, fontSize:13 }}>
                {lbl}
              </button>
            ))}
          </div>

          {/* ── INVENTARISATIE ── */}
          {tab === 'inventaris' && (
            <div className="fade-in">
              {overleggen.map(o => (
                <div key={o.id} style={{ background:C.white, border:`1px solid ${editing===o.id ? C.navy : C.border}`, borderRadius:10, padding:16, marginBottom:10, borderLeft:`3px solid ${TYPE_COLORS[o.type]||C.border}`, boxShadow: editing===o.id ? `0 0 0 3px rgba(26,48,87,0.1)` : '0 1px 4px rgba(0,0,0,0.04)' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom: editing===o.id ? 12 : 0 }}>
                    <div style={{ flex:1, cursor:'pointer' }} onClick={() => setEditing(editing===o.id ? null : o.id)}>
                      <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
                        <span style={{ fontFamily:"'Lora',serif", fontSize:14, fontWeight:700 }}>{o.naam}</span>
                        <span style={S.pill(TYPE_COLORS[o.type]||C.mid)}>{o.type}</span>
                        <span style={S.pill(PRIO_COLORS[o.prioriteit]||C.mid)}>{o.prioriteit}</span>
                        {toetsTotaal(o) && <span style={S.pill(TOETS_COLORS[toetsTotaal(o)]||C.mid)}>{toetsTotaal(o)}</span>}
                      </div>
                      <div style={{ fontSize:12, color:C.mid }}>{o.eigenaar} · {o.frequentie} · {o.domein}</div>
                    </div>
                    <div style={{ display:'flex', gap:6 }}>
                      <button onClick={() => setEditing(editing===o.id ? null : o.id)}
                        style={{ background:'none', border:'none', cursor:'pointer', color:C.navyLt, fontSize:13 }}>
                        {editing===o.id ? '▲' : '▼'}
                      </button>
                      <button onClick={() => del(o.id)} style={{ background:'none', border:'none', cursor:'pointer', color:C.light, fontSize:16 }}>×</button>
                    </div>
                  </div>

                  {editing === o.id && (
                    <div style={{ display:'flex', flexDirection:'column', gap:10 }} className="fade-in">
                      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                        {[['naam','Naam'],['eigenaar','Eigenaar'],['deelnemers','Deelnemers']].map(([k,l]) => (
                          <div key={k} style={{ display:'flex', flexDirection:'column', gap:4 }}>
                            <label style={{ ...S.label, fontSize:11 }}>{l}</label>
                            <input style={{ ...S.inp, fontSize:13 }} value={o[k]||''} onChange={e => update(o.id,k,e.target.value)} />
                          </div>
                        ))}
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Domein</label>
                          <select style={{ ...S.inp, fontSize:13 }} value={o.domein||''} onChange={e => update(o.id,'domein',e.target.value)}>
                            {['Netwerk','Team & HR','Overleg','Inhoudelijk dossier'].map(v => <option key={v}>{v}</option>)}
                          </select>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Type</label>
                          <select style={{ ...S.inp, fontSize:13 }} value={o.type||''} onChange={e => update(o.id,'type',e.target.value)}>
                            {['Intern','Extern','Beide'].map(v => <option key={v}>{v}</option>)}
                          </select>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Frequentie</label>
                          <select style={{ ...S.inp, fontSize:13 }} value={o.frequentie||''} onChange={e => update(o.id,'frequentie',e.target.value)}>
                            {['Wekelijks','Tweewekelijks','Maandelijks','Kwartaal','Ad hoc','Wisselend'].map(v => <option key={v}>{v}</option>)}
                          </select>
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Prioriteit</label>
                          <select style={{ ...S.inp, fontSize:13 }} value={o.prioriteit||''} onChange={e => update(o.id,'prioriteit',e.target.value)}>
                            {['Hoog','Medium','Laag','Geen prio','Nvt'].map(v => <option key={v}>{v}</option>)}
                          </select>
                        </div>
                      </div>
                      <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                        <label style={{ ...S.label, fontSize:11 }}>Doel</label>
                        <textarea style={{ ...S.ta, fontSize:13 }} rows={2} value={o.doel||''} onChange={e => update(o.id,'doel',e.target.value)} />
                      </div>
                      <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                        <label style={{ ...S.label, fontSize:11 }}>Relaties met andere overleggen</label>
                        <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>
                          {namen.filter(n => n !== o.naam).map(n => (
                            <button key={n} onClick={() => update(o.id,'relaties', o.relaties.includes(n) ? o.relaties.filter(r=>r!==n) : [...o.relaties,n])}
                              style={{ padding:'4px 10px', borderRadius:16, fontSize:11, border:`1.5px solid ${o.relaties.includes(n) ? C.navy : C.border}`, background: o.relaties.includes(n) ? C.navy+'18' : C.white, color: o.relaties.includes(n) ? C.navy : C.mid, cursor:'pointer' }}>
                              {n}
                            </button>
                          ))}
                        </div>
                      </div>
                      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Stand van zaken</label>
                          <textarea style={{ ...S.ta, fontSize:13 }} rows={2} value={o.standVanZaken||''} onChange={e => update(o.id,'standVanZaken',e.target.value)} />
                        </div>
                        <div style={{ display:'flex', flexDirection:'column', gap:4 }}>
                          <label style={{ ...S.label, fontSize:11 }}>Acties nodig</label>
                          <textarea style={{ ...S.ta, fontSize:13 }} rows={2} value={o.actiesNodig||''} onChange={e => update(o.id,'actiesNodig',e.target.value)} />
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              ))}
            </div>
          )}

          {/* ── TOETSING ── */}
          {tab === 'toetsing' && (
            <div className="fade-in">
              <div style={{ fontSize:13, color:C.mid, marginBottom:16 }}>
                Beantwoord per overleg drie toetsvragen. Groen = Ja, Oranje = Deels, Rood = Nee.
              </div>
              {overleggen.map(o => (
                <div key={o.id} style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:16, marginBottom:10, borderLeft:`3px solid ${toetsTotaal(o) ? TOETS_COLORS[toetsTotaal(o)] : C.border}` }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10 }}>
                    <div>
                      <div style={{ fontFamily:"'Lora',serif", fontSize:13, fontWeight:700 }}>{o.naam}</div>
                      <div style={{ fontSize:11, color:C.mid }}>{o.eigenaar} · {o.type}</div>
                    </div>
                    {toetsTotaal(o) && <span style={S.pill(TOETS_COLORS[toetsTotaal(o)]||C.mid)}>{toetsTotaal(o)}</span>}
                  </div>
                  {TOETS_VRAGEN.map(v => (
                    <div key={v.id} style={{ marginBottom:8 }}>
                      <div style={{ fontSize:12, color:C.mid, marginBottom:4 }}>{v.label}</div>
                      <div style={{ display:'flex', gap:6 }}>
                        {['Ja','Deels','Nee'].map(opt => (
                          <button key={opt} onClick={() => updateToets(o.id, v.id, o.toets?.[v.id]===opt ? undefined : opt)}
                            style={{ padding:'5px 14px', borderRadius:16, fontSize:12, border:`1.5px solid ${o.toets?.[v.id]===opt ? TOETS_COLORS[opt] : C.border}`, background: o.toets?.[v.id]===opt ? TOETS_COLORS[opt]+'18' : C.white, color: o.toets?.[v.id]===opt ? TOETS_COLORS[opt] : C.mid, cursor:'pointer', fontWeight: o.toets?.[v.id]===opt ? 600 : 400 }}>
                            {opt}
                          </button>
                        ))}
                      </div>
                    </div>
                  ))}
                  <div style={{ marginTop:8 }}>
                    <label style={{ ...S.label, fontSize:11 }}>Toelichting toetsing</label>
                    <textarea style={{ ...S.ta, fontSize:12 }} rows={2} value={o.toelichting||''} onChange={e => update(o.id,'toelichting',e.target.value)} placeholder="Optioneel — aanvulling op de scores" />
                  </div>
                </div>
              ))}
            </div>
          )}

          {/* ── NETWERK ── */}
          {tab === 'netwerk' && (
            <div className="fade-in">
              <div style={{ display:'flex', gap:8, marginBottom:16 }}>
                {[['graph','🔗 Overlegnetwerk'],['persoon','👤 Persoonsniveau']].map(([id,lbl]) => (
                  <button key={id} onClick={() => setNetwerkTab(id)}
                    style={{ ...S.btnS, background: netwerkTab===id ? C.navyLt : 'transparent', color: netwerkTab===id ? C.white : C.navy, fontSize:12 }}>
                    {lbl}
                  </button>
                ))}
              </div>

              {netwerkTab === 'graph' && (
                <>
                  <NetworkGraph overleggen={overleggen} />
                  <div style={{ marginTop:20 }}>
                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:12 }}>
                      <div style={{ fontFamily:"'Lora',serif", fontSize:14, fontWeight:700, color:C.navy }}>AI-analyse overlegstructuur</div>
                      <button style={S.btnP} onClick={analyzeAI} disabled={aiLoading}>
                        {aiLoading ? <><Spinner /> Analyseren…</> : '🔍 Analyseer'}

    function NetworkGraph({ overleggen }) {
      const containerRef = React.useRef();
      const [fullscreen, setFullscreen] = useState(false);
      const PRIO_SIZE = { Hoog: 22, Medium: 15, Laag: 10, 'Geen prio': 10, Nvt: 10 };

      const buildGraph = React.useCallback((el) => {
        if (!el || typeof d3 === 'undefined') return;
        d3.select(el).selectAll('*').remove();

        const w = el.offsetWidth || 700, h = fullscreen ? window.innerHeight - 120 : 650;
        const svg = d3.select(el).append('svg').attr('width', w).attr('height', h).style('display','block');
        svg.append('rect').attr('width', w).attr('height', h).attr('fill', '#F6F2EA').attr('rx', 10);

        const g = svg.append('g');
        const zoom = d3.zoom().scaleExtent([0.15, 5]).on('zoom', e => g.attr('transform', e.transform));
        svg.call(zoom);

        svg.append('text').attr('x', 10).attr('y', h - 10)
          .attr('font-size', 10).attr('fill', '#AAA').attr('font-family', 'Inter, sans-serif')
          .text('Scroll = zoom · Sleep achtergrond = pan · Sleep bolletje = verplaatsen (blijft vast)');

        const nodes = overleggen.map(o => ({
          id: o.naam, type: o.type, prio: o.prioriteit, eigenaar: o.eigenaar,
          toets: Object.values(o.toets||{}), fixed: false
        }));
        const links = [];
        overleggen.forEach(o => {
          (o.relaties||[]).forEach(r => {
            if (overleggen.find(x => x.naam === r)) links.push({ source: o.naam, target: r });
          });
        });

        const sim = d3.forceSimulation(nodes)
          .force('link', d3.forceLink(links).id(d => d.id).distance(120))
          .force('charge', d3.forceManyBody().strength(-220))
          .force('center', d3.forceCenter(w/2, h/2))
          .force('collision', d3.forceCollide(d => (PRIO_SIZE[d.prio]||12) + 22));

        const link = g.append('g').selectAll('line').data(links).join('line')
          .attr('stroke', '#C0B8A8').attr('stroke-width', 1.5);

        const node = g.append('g').selectAll('g').data(nodes).join('g').style('cursor','grab')
          .call(d3.drag()
            .filter(e => !e.ctrlKey && !e.button)
            .on('start', (e,d) => {
              e.sourceEvent.stopPropagation();
              if (!e.active) sim.alphaTarget(0.3).restart();
              d.fx = d.x; d.fy = d.y;
            })
            .on('drag', (e,d) => { d.fx = e.x; d.fy = e.y; })
            .on('end', (e,d) => {
              if (!e.active) sim.alphaTarget(0);
              // Keep node pinned where dropped
              d.fx = e.x; d.fy = e.y;
            })
          );

        node.append('circle')
          .attr('r', d => PRIO_SIZE[d.prio]||12)
          .attr('fill', d => TYPE_COLORS[d.type]||C.navy)
          .attr('opacity', 0.88)
          .attr('stroke', C.white).attr('stroke-width', 2);

        // Double-click to unpin
        node.on('dblclick', (e, d) => { e.stopPropagation(); d.fx = null; d.fy = null; sim.alphaTarget(0.1).restart(); });

        node.append('text')
          .attr('text-anchor','middle')
          .attr('dy', d => (PRIO_SIZE[d.prio]||12) + 13)
          .attr('font-size', 9).attr('fill', C.navy).attr('font-weight','600')
          .attr('pointer-events','none')
          .text(d => d.id.length > 20 ? d.id.slice(0,18)+'…' : d.id);

        const tooltip = d3.select(el).append('div')
          .style('position','absolute').style('background', C.navyDk).style('color', C.white)
          .style('padding','8px 12px').style('border-radius','8px').style('font-size','12px')
          .style('pointer-events','none').style('opacity',0).style('max-width','240px')
          .style('font-family',"'Inter', sans-serif").style('line-height','1.6').style('z-index','20');

        node.on('mouseenter', (e,d) => {
          const vals = d.toets;
          const t = vals.length ? (vals.every(v=>v==='Ja') ? '✅' : vals.some(v=>v==='Nee') ? '❌' : '⚠') : '–';
          tooltip.style('opacity',1).html(`<strong>${d.id}</strong><br/>${d.eigenaar||'geen eigenaar'}<br/>${d.prio} · ${d.type} · ${t}<br/><em style="font-size:10px;opacity:0.6">Dubbelklik om los te maken</em>`);
        }).on('mousemove', e => {
          const rect = el.getBoundingClientRect();
          tooltip.style('left', (e.clientX-rect.left+14)+'px').style('top', (e.clientY-rect.top-40)+'px');
        }).on('mouseleave', () => tooltip.style('opacity', 0));

        sim.on('tick', () => {
          link.attr('x1',d=>d.source.x).attr('y1',d=>d.source.y)
              .attr('x2',d=>d.target.x).attr('y2',d=>d.target.y);
          node.attr('transform', d => `translate(${d.x},${d.y})`);
        });

        return () => sim.stop();
      }, [overleggen, fullscreen]);

      React.useEffect(() => {
        const el = containerRef.current;
        if (!el) return;
        return buildGraph(el);
      }, [buildGraph]);

      const legenda = [['Intern',C.navy],['Extern',C.gold],['Beide',C.green]];
      const h = fullscreen ? window.innerHeight - 120 : 650;

      return (
        <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, overflow:'hidden' }}>
          <div style={{ background:C.navy, padding:'10px 16px', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:8 }}>
            <span style={{ fontFamily:"'Lora',serif", fontSize:13, fontWeight:700, color:C.white }}>Netwerkvisualisatie</span>
            <div style={{ display:'flex', gap:10, flexWrap:'wrap', alignItems:'center' }}>
              {legenda.map(([lbl,col]) => (
                <div key={lbl} style={{ display:'flex', alignItems:'center', gap:4, fontSize:11, color:'rgba(255,255,255,0.7)' }}>
                  <div style={{ width:10, height:10, borderRadius:'50%', background:col }} />{lbl}
                </div>
              ))}
              <span style={{ fontSize:10, color:'rgba(255,255,255,0.4)' }}>Groot = hoge prio</span>
              <button onClick={() => setFullscreen(f => !f)}
                style={{ background:'rgba(255,255,255,0.15)', border:'none', color:C.white, borderRadius:6, padding:'4px 10px', fontSize:11, cursor:'pointer' }}>
                {fullscreen ? '⊡ Kleiner' : '⊞ Volledig scherm'}
              </button>
            </div>
          </div>
          <div ref={containerRef} style={{ position:'relative', width:'100%', height:h }} />
        </div>
      );
    }

    // ─── DASHBOARD ────────────────────────────────────────────────────────────
    const FASE_DEF = [
      { id:'f0',  label:'Fase 0',  titel:'Mandate ophalen',
        beschrijving:'Bevestigde opdracht + rolverdeling teamleider',
        checkItems:['Gesprek met hoofdofficier','Opdrachtnotitie verstuurd','Bevestiging ontvangen','Rolverdeling teamleider vastgesteld'] },

      { id:'f4',  label:'Fase 4',  titel:'Borging',

        return localStorage.getItem('om-dashboard-fase') || 'f1';

                      <div style={{ display:'flex', alignItems:'center', gap:8, flexShrink:0, marginLeft:12 }}>
                        <span style={{ fontSize:11, fontWeight:600, color:style.color, background:style.bg, border:`1px solid ${style.border}`, padding:'3px 10px', borderRadius:20 }}>
                          {st==='afgerond' ? '✓ Afgerond' : st==='actief' ? '● Actief' : '○ Open'}
                        </span>
                        <span style={{ color:C.light, fontSize:16 }}>{isOpen ? '−' : '+'}</span>
                      </div>
                    </div>
                    {st !== 'open' && (
                      <div style={{ marginTop:8, display:'flex', alignItems:'center', gap:8 }}>
                        <div style={{ flex:1, height:4, background:C.creamDk, borderRadius:2, overflow:'hidden' }}>
                          <div style={{ width:`${(done/total)*100}%`, height:'100%', background: st==='afgerond' ? C.green : C.navyLt, borderRadius:2 }} />
                        </div>
                        <span style={{ fontSize:10, color:C.mid }}>{done}/{total}</span>
                      </div>
                    )}
                  </div>
                </div>

                {/* Body */}
                {isOpen && (
                  <div style={{ padding:'0 18px 18px', borderTop:`1px solid ${style.border}44` }} className="fade-in">
                    <div style={{ paddingTop:14 }}>
                      <div style={{ fontSize:12, fontWeight:700, color:C.navy, marginBottom:10 }}>Stappen</div>
                      {fase.checkItems.map((item, i) => {
                        const key = `${fase.id}_${i}`;
                        const done = !!checks[key];
                        return (
                          <div key={i} style={{ display:'flex', alignItems:'flex-start', gap:10, marginBottom:8, cursor:'pointer' }}
                            onClick={() => toggle(fase.id, i)}>
                            <div style={{ width:18, height:18, borderRadius:5, flexShrink:0, marginTop:1, background: done ? C.green : C.white, border:`2px solid ${done ? C.green : C.border}`, display:'flex', alignItems:'center', justifyContent:'center', transition:'all 0.15s' }}>
                              {done && <span style={{ color:C.white, fontSize:10, fontWeight:700 }}>✓</span>}
                            </div>
                            <span style={{ fontSize:13, color: done ? C.mid : C.text, textDecoration: done ? 'line-through' : 'none', lineHeight:1.4 }}>{item}</span>
                          </div>
                        );
                      })}

                      {/* Fase 1 live stats */}
                      {fase.id === 'f1' && (
                        <div style={{ marginTop:14, padding:'12px 14px', background:C.creamDk, borderRadius:8 }}>
                          <div style={{ fontSize:11, fontWeight:700, color:C.navy, marginBottom:10 }}>Live voortgang</div>
                          {[['Medewerkers',M,15,C.navyLt],['Stakeholders',S,6,C.gold],['Bronnen',bronnen.length,5,C.green]].map(([lbl,val,max,col]) => (
                            <div key={lbl} style={{ marginBottom:8 }}>
                              <div style={{ display:'flex', justifyContent:'space-between', fontSize:11, color:C.mid, marginBottom:3 }}>
                                <span>{lbl}</span><span>{val}/{max}</span>
                              </div>
                              <div style={{ height:6, background:C.white, borderRadius:3, overflow:'hidden' }}>
                                <div style={{ width:`${Math.min((val/max)*100,100)}%`, height:'100%', background:col, borderRadius:3 }} />
                              </div>
                            </div>
                          ))}
                          <button onClick={() => onNav('gesprekken')} style={{ ...S.btnS, fontSize:11, padding:'5px 12px', marginTop:6 }}>→ Naar gesprekken</button>
                        </div>
                      )}

                      {/* Fase 1B live stats */}
                      {fase.id === 'f1b' && (
                        <div style={{ marginTop:14, padding:'12px 14px', background:C.creamDk, borderRadius:8 }}>
                          <div style={{ fontSize:11, fontWeight:700, color:C.navy, marginBottom:6 }}>Parketleidingsgesprekken</div>
                          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                            <div style={{ flex:1, height:6, background:C.white, borderRadius:3, overflow:'hidden' }}>
                              <div style={{ width:`${(PL/3)*100}%`, height:'100%', background:C.green, borderRadius:3 }} />
                            </div>
                            <span style={{ fontSize:11, color:C.mid }}>{PL}/3</span>
                          </div>
                          <button onClick={() => onNav('gesprekken')} style={{ ...S.btnS, fontSize:11, padding:'5px 12px', marginTop:8 }}>→ Parketleiding gesprek toevoegen</button>
                        </div>
                      )}
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      );
    }

    // ─── INSTELLINGEN ─────────────────────────────────────────────────────────
    function InstellingenView({ apiKey, onSaveKey, gesprekken, bronnen, overleggen, onImport }) {
      const [key, setKey] = useState(apiKey);
      const [saved, setSaved] = useState(false);
      const [importErr, setImportErr] = useState('');
      const [importOk, setImportOk] = useState('');
      const fileRef = React.useRef();

      const save = () => { onSaveKey(key); setSaved(true); setTimeout(() => setSaved(false), 2000); };

      const exportData = () => {
        const data = { versie: 1, datum: new Date().toISOString(), gesprekken, bronnen, overleggen };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `om-gesprekken-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.gesprekken) throw new Error('Ongeldig bestand');
            onImport(data);
            setImportErr('');
            setImportOk(`${data.gesprekken.length} gesprekken en ${(data.bronnen||[]).length} bronnen teruggezet.`);
            setTimeout(() => setImportOk(''), 4000);
          } catch {
            setImportErr('Ongeldig bestand — controleer of je het juiste JSON-bestand uploadt.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div>
          <div style={S.secTitle}>Instellingen</div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:20 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:6 }}>Back-up</div>
            <div style={{ fontSize:13, color:C.mid, marginBottom:16 }}>
              Exporteer alle gesprekken en bronnen als JSON. Bewaar dit op een veilige plek — je kunt het altijd terugzetten, ook na een URL-wijziging of herinstallatie.
            </div>
            <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
              <button style={S.btnP} onClick={exportData}>⬇ Exporteer ({gesprekken.length} gesprekken · {overleggen.length} overleggen)</button>
              <button style={S.btnS} onClick={() => fileRef.current.click()}>⬆ Importeer back-up</button>
              <input ref={fileRef} type="file" accept=".json" style={{ display:'none' }} onChange={importData} />
            </div>
            {importOk && <div style={{ fontSize:13, color:C.green, marginTop:10, fontWeight:600 }}>✓ {importOk}</div>}
            {importErr && <div style={{ fontSize:13, color:C.red, marginTop:10 }}>{importErr}</div>}
          </div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:16 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:16 }}>API-sleutel</div>
            <label style={S.label}>Anthropic API-sleutel</label>
            <input style={{ ...S.inp, fontFamily:'monospace', fontSize:13, marginBottom:8 }}
              type="password" placeholder="sk-ant-..." value={key} onChange={e => setKey(e.target.value)} />
            <div style={{ fontSize:12, color:C.light, marginBottom:16 }}>
              Haal je sleutel op via <a href="https://console.anthropic.com" target="_blank" style={{ color:C.navyLt }}>console.anthropic.com</a>
            </div>
            <button style={S.btnP} onClick={save}>{saved ? '✓ Opgeslagen' : 'Sleutel opslaan'}</button>
          </div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:16 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:16 }}>Gegevens</div>
            <div style={{ fontSize:14, color:C.mid, marginBottom:16 }}>{gesprekken.length} gesprekken · {bronnen.length} bronnen in lokale opslag.</div>
            <button style={{ ...S.btnS, color:C.red, borderColor:C.red }}
              onClick={() => { if(window.confirm('Alle gesprekken, bronnen en diagnose definitief verwijderen?')) { localStorage.removeItem('om-gesprekken'); localStorage.removeItem('om-context'); localStorage.removeItem('om-diagnose'); window.location.reload(); } }}>
              Alle gegevens verwijderen
            </button>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [apiKey, setApiKeyState] = useState(() => store.getApiKey());
      const [showSetup, setShowSetup] = useState(() => !store.getApiKey());
      const [view, setView] = useState('dashboard');
      const [gesprekken, setGesprekken] = useState(() => store.loadGesprekken());
      const [bronnen, setBronnen] = useState(() => store.loadContext());
      const [overleggen, setOverleggen] = useState(() => store.loadOverleggen() || START_OVERLEGGEN);
      const [editingId, setEditingId] = useState(null);

      useEffect(() => { store.saveGesprekken(gesprekken); }, [gesprekken]);
      useEffect(() => { store.saveContext(bronnen); }, [bronnen]);
      useEffect(() => { store.saveOverleggen(overleggen); }, [overleggen]);

      const handleImport = useCallback((data) => {
        setGesprekken(data.gesprekken || []);
        setBronnen(data.bronnen || []);
        if (data.overleggen) setOverleggen(data.overleggen);
      }, []);

      const handleSaveKey = (k) => { store.setApiKey(k); setApiKeyState(k); setShowSetup(false); };
      const handleSave = useCallback((data) => {
        if (editingId) setGesprekken(prev => prev.map(g => g.id===editingId ? { ...data, id:editingId } : g));
        else setGesprekken(prev => [...prev, { ...data, id:uid() }]);
        setEditingId(null); setView('gesprekken');
      }, [editingId]);

      if (showSetup) return <SetupView onSave={handleSaveKey} />;

      const navItems = [
        { id:'dashboard',    label:'Dashboard',    },
        { id:'gesprekken',   label:'Gesprekken',   },
        { id:'patronen',     label:'Patronen',     },
        { id:'diagnose',     label:'Diagnose',     },
        { id:'overleggen',   label:'Overleggen',   },
        { id:'notitie',      label:'Notitie',      },
        { id:'instellingen', label:'Instellingen', },
      ];

      return (
        <div style={S.app}>
          <header style={S.hdr}>
            <div style={S.hdrIn}>
              <div>
                <div style={S.title}>OM Gesprekken</div>
                <div style={S.sub}>{gesprekken.length} gesprekken · {gesprekken.filter(g=>g.type==='medewerker').length}M · {gesprekken.filter(g=>g.type==='stakeholder').length}S · {gesprekken.filter(g=>g.type==='parketleiding').length}PL{bronnen.length > 0 ? ` · ${bronnen.length} bronnen` : ''}</div>
              </div>
              {view !== 'form' && (
                <nav style={S.nav}>
                  {navItems.map(n => (
                    <button key={n.id} style={S.navBtn(view===n.id)} onClick={() => setView(n.id)}>
                      {n.label}
                    </button>
                  ))}
                </nav>
              )}
            </div>
          </header>
          <main style={S.main}>
            {view==='dashboard' && <DashboardView gesprekken={gesprekken} bronnen={bronnen} onNav={setView} />}
            {view==='gesprekken' && <GesprekkenView gesprekken={gesprekken} onNew={() => { setEditingId(null); setView('form'); }} onEdit={id => { setEditingId(id); setView('form'); }} onDelete={id => setGesprekken(prev => prev.filter(g => g.id!==id))} />}
            {view==='form' && <FormView gesprek={editingId ? gesprekken.find(g=>g.id===editingId) : null} onSave={handleSave} onCancel={() => { setEditingId(null); setView('gesprekken'); }} />}
            {view==='patronen' && <PatronenView gesprekken={gesprekken} apiKey={apiKey} />}
            {view==='diagnose' && <DiagnoseView gesprekken={gesprekken} bronnen={bronnen} onBronnenChange={setBronnen} apiKey={apiKey} />}
            {view==='overleggen' && <OverleggenView overleggen={overleggen} onOverleggenChange={setOverleggen} apiKey={apiKey} />}
            {view==='notitie' && <NotitieView gesprekken={gesprekken} apiKey={apiKey} />}
            {view==='instellingen' && <InstellingenView apiKey={apiKey} onSaveKey={handleSaveKey} gesprekken={gesprekken} bronnen={bronnen} overleggen={overleggen} onImport={handleImport} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
