<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1A3057" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="OM Gesprekken" />
  <title>OM Gesprekken</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #F6F2EA; color: #1C1C1C; -webkit-font-smoothing: antialiased; }
    #root { min-height: 100vh; }
    textarea, input, button { font-family: 'Inter', system-ui, sans-serif; }
    textarea:focus, input:focus { outline: none; border-color: #1A3057 !important; box-shadow: 0 0 0 3px rgba(26,48,87,0.12) !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .fade-in { animation: fadeIn 0.2s ease; }
    ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-track { background: transparent; } ::-webkit-scrollbar-thumb { background: #D5CFBF; border-radius: 3px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ─── COLORS ───────────────────────────────────────────────────────────────
    const C = {
      navy:'#1A3057', navyDk:'#0F1E38', navyLt:'#2A4A7F',
      cream:'#F6F2EA', creamDk:'#EDE8DF',
      border:'#D5CFBF', gold:'#A67C00',
      text:'#1C1C1C', mid:'#555', light:'#888',
      green:'#2D6A4F', orange:'#B85C00', red:'#8B1A1A',
      white:'#FFFFFF',
    };

    // ─── STORAGE (localStorage) ───────────────────────────────────────────────
    const store = {
      loadGesprekken:  () => { try { return JSON.parse(localStorage.getItem('om-gesprekken') || '[]'); } catch { return []; } },
      saveGesprekken:  (d) => { try { localStorage.setItem('om-gesprekken', JSON.stringify(d)); } catch {} },
      loadContext:     () => { try { return JSON.parse(localStorage.getItem('om-context') || '[]'); } catch { return []; } },
      saveContext:     (d) => { try { localStorage.setItem('om-context', JSON.stringify(d)); } catch {} },
      getApiKey:       () => localStorage.getItem('om-api-key') || '',
      setApiKey:       (k) => localStorage.setItem('om-api-key', k),
    };

    // ─── CLAUDE API ───────────────────────────────────────────────────────────
    async function claude(messages, system, apiKey) {
      const r = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-api-key': apiKey,
          'anthropic-version': '2023-06-01',
          'anthropic-dangerous-direct-browser-access': 'true',
        },
        body: JSON.stringify({ model: 'claude-sonnet-4-5', max_tokens: 8000, system, messages }),
      });
      const d = await r.json();
      if (d.error) throw new Error(d.error.message);
      return d.content?.map(b => b.text || '').join('\n') || '';
    }

    // ─── TEMPLATES ────────────────────────────────────────────────────────────
    const TPL_A = [
      { id:'p', title:'01 · Persoonlijk', hint:'Begin zelf — deel iets persoonlijks voordat je het vraagt', fields:[
        { id:'pers_ach', label:'Achtergrond & loopbaan', rows:3 },
        { id:'pers_stijl', label:'Werkstijl & energie — wat past, wat absoluut niet', rows:3 },
      ]},
      { id:'w', title:'02 · Werk en rol', hint:'Let op rolduidelijkheid: weet iemand wat er van hem/haar verwacht wordt?', fields:[
        { id:'werk_uitleg', label:'Hoe legt iemand zijn werk uit aan iemand buiten het werk', rows:3 },
        { id:'werk_sterk', label:'Sterktes — wat zou de afdeling missen', rows:2 },
        { id:'werk_energ', label:'Energiegevers versus energievreters', rows:3 },
      ]},
      { id:'s', title:'03 · Samenwerking', hint:'Silovorming en frictiegebieden zitten hier tussen de regels', fields:[
        { id:'sw_wie', label:'Met wie samengewerkt, hoe loopt dat', rows:3 },
        { id:'sw_loopt', label:'Wat gaat vanzelf — wat kost elke keer moeite', rows:3 },
        { id:'sw_zoekt', label:'Wie zoekt wie op', rows:2 },
      ]},
      { id:'b', title:'04 · Buiten en behoeften', hint:'Reactief of pro-actief patroon? Wie stuurt de agenda?', fields:[
        { id:'buit_sh', label:'Stakeholders — weten die wat hij/zij voor ze kan doen', rows:3 },
        { id:'buit_waarde', label:'Wanneer is er echt toegevoegde waarde — en wanneer niet', rows:3 },
      ]},
      { id:'a', title:'05 · De afdeling als geheel', hint:'De goudvraag aan het einde is het meest waardevol', fields:[
        { id:'afd_goed', label:'Wat gaat goed / wat koesteren', rows:2 },
        { id:'afd_anders', label:'Wat anders zou moeten', rows:3 },
        { id:'afd_nodig', label:'Wat heeft hij/zij nodig om werk echt goed te doen', rows:2 },
        { id:'afd_goud', label:'Goudvraag — wat ga ik onderschatten of niet meteen snappen', rows:3 },
      ]},
    ];

    const TPL_B = [
      { id:'c', title:'01 · Hun werk en context', hint:'Niet over jouw afdeling beginnen — eerst hun wereld begrijpen', fields:[
        { id:'b_druk', label:'Grootste uitdagingen op dit moment — waar zit de druk', rows:3 },
        { id:'b_jaar', label:'Wat moet er over een jaar beter zijn dan nu', rows:3 },
      ]},
      { id:'r', title:'02 · Raakvlakken met jouw afdeling', hint:'Latente behoeften zitten zelden in wat mensen spontaan noemen — doorvragen', fields:[
        { id:'b_gebruik', label:'Waar maken ze gebruik van de afdeling — of zouden ze dat willen', rows:3 },
        { id:'b_stokt', label:'Wat gaat goed — wat stokt', rows:3 },
        { id:'b_latent', label:'Latente behoeften — wat willen ze maar vragen ze niet om, waarom niet', rows:4 },
        { id:'b_gemist', label:'Wat hebben ze weleens gezocht en niet gevonden', rows:3 },
      ]},
      { id:'pe', title:'03 · Perceptie van de afdeling', hint:'Niet aanvechten of verdedigen — gewoon opnemen', fields:[
        { id:'b_omschr', label:'Hoe omschrijven ze de afdeling aan een collega die er weinig van weet', rows:3 },
        { id:'b_verwacht', label:'Wat verwachten ze — en wat juist niet', rows:3 },
        { id:'b_verander', label:'Als ze één ding zouden veranderen aan hoe de afdeling werkt — wat dan', rows:3 },
      ]},
    ];

    const DIAG_A = [
      { id:'diag_rol',   label:'Rolduidelijkheid',    opts:['Helder','Vaag','Onduidelijk'],               colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_ori',   label:'Oriëntatie',           opts:['Buitengericht','Gemengd','Binnengericht'],   colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_eigen', label:'Eigenaarschap',        opts:['Sterk','Wisselend','Afwachtend'],            colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_inv',   label:'Informele invloed',    opts:['Ja','Deels','Nee'],                          colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_toon',  label:'Toon gesprek',         opts:['Positief','Neutraal','Kritisch','Gesloten'], colors:['#2D6A4F','#666','#B85C00','#8B1A1A'] },
    ];

    const DIAG_B = [
      { id:'diag_kent',  label:'Kent afdeling goed?',           opts:['Ja','Gedeeltelijk','Nauwelijks'], colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_react', label:'Afdeling reactief of pro-actief?', opts:['Pro-actief','Wisselend','Reactief'], colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_toon',  label:'Toon gesprek',                  opts:['Positief','Neutraal','Kritisch'],  colors:['#2D6A4F','#666','#8B1A1A'] },
    ];

    const TPL_PL = [
      { id:'strat', title:'01 · Strategische positie B&S', hint:"Geef ruimte — deze vragen zijn waarschijnlijk nog nooit zo gesteld. Als het antwoord vaag is: 'Wat zou het parket concreet missen als B&S er niet was?'", fields:[
        { id:'pl_waarom',  label:'Waarom bestaat B&S — wat voegt de afdeling toe aan het parket?', rows:4 },
        { id:'pl_missen',  label:'Wat zou het parket missen als B&S er niet was?', rows:3 },
        { id:'pl_rol',     label:'Wat is de strategische functie die u van B&S verwacht — niet de taken, maar de rol?', rows:4 },
      ]},
      { id:'mandaat', title:'02 · Mandaat en bevoegdheden', hint:'Zonder mandaat kan B&S niet pro-actief zijn. Dit bepaalt of verandering ook echt mogelijk is.', fields:[
        { id:'pl_bevoegd',  label:'Welke bevoegdheden en welk mandaat heeft B&S nodig om die rol waar te maken?', rows:4 },
        { id:'pl_grenzen',  label:'Waar liggen de grenzen — wat valt buiten het mandaat van B&S?', rows:3 },
        { id:'pl_verhouding', label:'Hoe verhoudt B&S zich tot andere afdelingen die raakvlakken hebben met deze rol?', rows:3 },
      ]},
      { id:'resultaat', title:'03 · Gewenst resultaat', hint:'', fields:[
        { id:'pl_succes',  label:'Wat zou u over een jaar zien dat u vertelt dat het gelukt is?', rows:4 },
        { id:'pl_verschil', label:'Wat is het verschil tussen B&S nu en B&S zoals u het voor ogen heeft?', rows:4 },
        { id:'pl_weten',   label:'Zijn er zaken die u heeft gehoord of gezien die ik moet weten voor mijn diagnose?', rows:3 },
      ]},
    ];

    const DIAG_PL = [
      { id:'diag_pl_strat',  label:'Strategische functie benoemd?', opts:['Helder','Deels','Niet'],    colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_pl_mandaat', label:'Mandaat expliciet?',           opts:['Ja','Deels','Nee'],          colors:['#2D6A4F','#B85C00','#8B1A1A'] },
      { id:'diag_pl_toon',   label:'Toon gesprek',                  opts:['Positief','Neutraal','Kritisch'], colors:['#2D6A4F','#666','#8B1A1A'] },
    ];

    const uid = () => Math.random().toString(36).slice(2,10);

    function gesprekToText(g) {
      const sections = g.type === 'medewerker' ? TPL_A : g.type === 'parketleiding' ? TPL_PL : TPL_B;
      const diags    = g.type === 'medewerker' ? DIAG_A : g.type === 'parketleiding' ? DIAG_PL : DIAG_B;
      let t = `=== ${g.type.toUpperCase()}: ${g.naam}${g.functie ? ` (${g.functie})` : ''}${g.cluster ? ` · ${g.cluster}` : ''} · ${g.datum} ===\n\n`;
      sections.forEach(s => {
        const body = s.fields.filter(f => g[f.id]?.trim()).map(f => `  ${f.label}:\n  ${g[f.id]}`).join('\n\n');
        if (body) t += `${s.title}\n${body}\n\n`;
      });
      const diag = diags.filter(f => g[f.id]).map(f => `${f.label}: ${g[f.id]}`).join('  |  ');
      if (diag) t += `Diagnose: ${diag}\n`;
      if (g.spontaan) t += `Spontaan genoemd: ${g.spontaan}\n`;
      if (g.regels) t += `Tussen de regels: ${g.regels}\n`;
      if (g.kernbev) t += `Kernbevindingen: ${g.kernbev}\n`;
      if (g.ontbreekt) t += `Wat ontbreekt nog: ${g.ontbreekt}\n`;
      if (g.frustratie) t += `Frustratie: ${g.frustratie}\n`;
      return t;
    }

    // ─── STYLES ───────────────────────────────────────────────────────────────
    const S = {
      app: { minHeight:'100vh', background:C.cream },
      hdr: { background:C.navy, color:C.white, padding:'0 20px', position:'sticky', top:0, zIndex:100, boxShadow:'0 2px 12px rgba(0,0,0,0.2)' },
      hdrIn: { maxWidth:900, margin:'0 auto', display:'flex', alignItems:'center', justifyContent:'space-between', height:56 },
      title: { fontFamily:"'Lora', Georgia, serif", fontSize:18, fontWeight:700, letterSpacing:'-0.3px' },
      sub: { fontSize:11, color:'rgba(255,255,255,0.5)', marginTop:1 },
      nav: { display:'flex', gap:4 },
      navBtn: (a) => ({ padding:'8px 14px', borderRadius:6, border:'none', cursor:'pointer', fontSize:13, fontWeight:500, background: a ? 'rgba(255,255,255,0.15)' : 'transparent', color: a ? C.white : 'rgba(255,255,255,0.6)', transition:'all 0.15s' }),
      main: { maxWidth:900, margin:'0 auto', padding:'24px 20px 80px' },
      card: { background:C.white, borderRadius:10, border:`1px solid ${C.border}`, padding:20, marginBottom:12, cursor:'pointer', transition:'box-shadow 0.15s', boxShadow:'0 1px 4px rgba(0,0,0,0.04)' },
      secTitle: { fontFamily:"'Lora', Georgia, serif", fontSize:22, fontWeight:700, color:C.navy, marginBottom:6 },
      label: { fontSize:13, fontWeight:600, color:C.navy, marginBottom:5, display:'block' },
      hint: { fontSize:12, color:C.orange, marginBottom:8, fontStyle:'italic' },
      ta: { width:'100%', border:`1px solid ${C.border}`, borderRadius:7, padding:'10px 12px', fontSize:14, color:C.text, background:C.white, resize:'vertical', lineHeight:1.6, transition:'border-color 0.15s, box-shadow 0.15s' },
      inp: { width:'100%', border:`1px solid ${C.border}`, borderRadius:7, padding:'10px 12px', fontSize:14, color:C.text, background:C.white, transition:'border-color 0.15s, box-shadow 0.15s' },
      btnP: { background:C.navy, color:C.white, border:'none', borderRadius:8, padding:'10px 22px', fontSize:14, fontWeight:600, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:6, transition:'opacity 0.15s' },
      btnS: { background:'transparent', color:C.navy, border:`1.5px solid ${C.navy}`, borderRadius:8, padding:'9px 20px', fontSize:14, fontWeight:600, cursor:'pointer', transition:'all 0.15s' },
      pill: (col) => ({ display:'inline-block', padding:'2px 10px', borderRadius:20, fontSize:11, fontWeight:600, background:col+'22', color:col, border:`1px solid ${col}44`, marginRight:4 }),
      secHdr: { display:'flex', alignItems:'center', justifyContent:'space-between', padding:'14px 18px', background:C.navy, borderRadius:8, cursor:'pointer', userSelect:'none', marginBottom:0 },
      secHdrTxt: { fontFamily:"'Lora', Georgia, serif", fontSize:15, fontWeight:700, color:C.white },
      diagRow: { display:'flex', alignItems:'flex-start', gap:16, padding:'12px 0', borderBottom:`1px solid ${C.creamDk}` },
      diagLbl: { fontSize:13, fontWeight:600, color:C.navy, width:150, flexShrink:0, paddingTop:6 },
      diagOpts: { display:'flex', flexWrap:'wrap', gap:6 },
      optBtn: (sel, col) => ({ padding:'7px 14px', borderRadius:20, border:`1.5px solid ${sel ? col : C.border}`, background: sel ? col+'18' : C.white, color: sel ? col : C.mid, fontSize:13, fontWeight: sel ? 600 : 400, cursor:'pointer', transition:'all 0.1s' }),
      mcell: (col) => ({ width:22, height:22, borderRadius:4, background:col, display:'flex', alignItems:'center', justifyContent:'center', fontSize:9, fontWeight:700, color:C.white, flexShrink:0 }),
      aiBox: { background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, whiteSpace:'pre-wrap', fontSize:14, lineHeight:1.8, color:C.text },
      empty: { textAlign:'center', padding:'60px 20px', color:C.light },
    };

    // ─── SMALL COMPONENTS ─────────────────────────────────────────────────────
    function Spinner() {
      return <span style={{ display:'inline-block', width:15, height:15, border:'2px solid rgba(255,255,255,0.35)', borderTopColor:C.white, borderRadius:'50%', animation:'spin 0.7s linear infinite' }} />;
    }

    function TypeBadge({ type }) {
      const color = type === 'medewerker' ? C.navyLt : type === 'parketleiding' ? C.green : C.gold;
      const label = type === 'medewerker' ? 'Medewerker' : type === 'parketleiding' ? 'Parketleiding' : 'Stakeholder';
      return <span style={S.pill(color)}>{label}</span>;
    }

    function Accordion({ title, hint, open, onToggle, children }) {
      return (
        <div style={{ marginBottom:16 }}>
          <div style={S.secHdr} onClick={onToggle}>
            <span style={S.secHdrTxt}>{title}</span>
            <span style={{ color:'rgba(255,255,255,0.7)', fontSize:18 }}>{open ? '−' : '+'}</span>
          </div>
          {open && (
            <div style={{ padding:'20px 0 4px', display:'flex', flexDirection:'column', gap:16 }} className="fade-in">
              {hint && <div style={S.hint}>💡 {hint}</div>}
              {children}
            </div>
          )}
        </div>
      );
    }

    // ─── SETUP SCREEN ─────────────────────────────────────────────────────────
    function SetupView({ onSave }) {
      const [key, setKey] = useState('');
      return (
        <div style={{ minHeight:'100vh', background:C.navy, display:'flex', alignItems:'center', justifyContent:'center', padding:24 }}>
          <div style={{ background:C.white, borderRadius:16, padding:40, maxWidth:440, width:'100%', boxShadow:'0 20px 60px rgba(0,0,0,0.3)' }}>
            <div style={{ fontFamily:"'Lora', Georgia, serif", fontSize:26, fontWeight:700, color:C.navy, marginBottom:8 }}>OM Gesprekken</div>
            <div style={{ fontSize:14, color:C.mid, marginBottom:28, lineHeight:1.6 }}>
              Om patronenanalyse en bevindingsnotities te genereren heb je een Anthropic API-sleutel nodig. Je sleutel wordt lokaal opgeslagen en nooit gedeeld.
            </div>
            <label style={S.label}>Anthropic API-sleutel</label>
            <input style={{ ...S.inp, marginBottom:8, fontFamily:'monospace', fontSize:13 }}
              type="password" placeholder="sk-ant-..." value={key} onChange={e => setKey(e.target.value)}
              onKeyDown={e => e.key === 'Enter' && key.startsWith('sk-') && onSave(key)} />
            <div style={{ fontSize:12, color:C.light, marginBottom:24 }}>
              Haal je sleutel op via <a href="https://console.anthropic.com" target="_blank" style={{ color:C.navyLt }}>console.anthropic.com</a>
            </div>
            <button style={{ ...S.btnP, width:'100%', justifyContent:'center' }}
              onClick={() => key.startsWith('sk-') && onSave(key)} disabled={!key.startsWith('sk-')}>
              Opslaan en starten
            </button>
            <div style={{ marginTop:16, fontSize:12, color:C.light, textAlign:'center' }}>
              De app werkt ook zonder sleutel — alleen AI-functies zijn dan uitgeschakeld.
            </div>
            <button style={{ ...S.btnS, width:'100%', justifyContent:'center', marginTop:8, fontSize:13 }}
              onClick={() => onSave('')}>Verder zonder sleutel</button>
          </div>
        </div>
      );
    }

    // ─── GESPREKKEN LIST ──────────────────────────────────────────────────────
    function GesprekkenView({ gesprekken, onNew, onEdit, onDelete }) {
      const [search, setSearch] = useState('');
      const filtered = gesprekken.filter(g =>
        !search || [g.naam, g.functie, g.cluster].some(v => v?.toLowerCase().includes(search.toLowerCase()))
      );
      return (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
            <div>
              <div style={S.secTitle}>Gesprekken</div>
              <div style={{ fontSize:13, color:C.mid }}>
                {gesprekken.length} gesprekken · {gesprekken.filter(g => g.type==='medewerker').length} medewerkers · {gesprekken.filter(g => g.type==='stakeholder').length} stakeholders
              </div>
            </div>
            <button style={S.btnP} onClick={onNew}>+ Nieuw gesprek</button>
          </div>
          {gesprekken.length > 3 && (
            <input style={{ ...S.inp, marginBottom:16 }} placeholder="Zoeken…" value={search} onChange={e => setSearch(e.target.value)} />
          )}
          {filtered.length === 0 && (
            <div style={S.empty}>
              <div style={{ fontSize:40, marginBottom:12 }}>📋</div>
              <div style={{ fontSize:16, fontWeight:600, marginBottom:6 }}>Nog geen gesprekken</div>
              <div style={{ fontSize:14 }}>Voeg je eerste kennismakingsgesprek toe.</div>
            </div>
          )}
          {filtered.map(g => {
            const diags = g.type === 'medewerker' ? DIAG_A : DIAG_B;
            return (
              <div key={g.id} onClick={() => onEdit(g.id)}
                style={{ ...S.card, borderLeft:`3px solid ${g.type==='medewerker' ? C.navyLt : g.type==='parketleiding' ? C.green : C.gold}` }}
                onMouseEnter={e => e.currentTarget.style.boxShadow='0 4px 12px rgba(0,0,0,0.1)'}
                onMouseLeave={e => e.currentTarget.style.boxShadow='0 1px 4px rgba(0,0,0,0.04)'}>
                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
                  <div style={{ flex:1 }}>
                    <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:4 }}>
                      <span style={{ fontFamily:"'Lora', serif", fontSize:16, fontWeight:700 }}>{g.naam || '(geen naam)'}</span>
                      <TypeBadge type={g.type} />
                    </div>
                    <div style={{ fontSize:13, color:C.mid, marginBottom:8 }}>
                      {[g.functie, g.cluster, g.datum].filter(Boolean).join(' · ')}
                    </div>
                    <div style={{ display:'flex', flexWrap:'wrap', gap:4 }}>
                      {diags.filter(f => g[f.id]).map(f => {
                        const idx = f.opts.indexOf(g[f.id]);
                        return <span key={f.id} style={S.pill(f.colors[idx] || C.mid)}>{g[f.id]}</span>;
                      })}
                    </div>
                  </div>
                  <button onClick={e => { e.stopPropagation(); if(window.confirm('Gesprek verwijderen?')) onDelete(g.id); }}
                    style={{ background:'none', border:'none', cursor:'pointer', color:C.light, fontSize:20, padding:'0 4px', lineHeight:1 }}>×</button>
                </div>
                {g.kernbev && (
                  <div style={{ fontSize:13, color:C.mid, marginTop:8, paddingTop:8, borderTop:`1px solid ${C.creamDk}`, fontStyle:'italic' }}>

    // ─── GRAFIEKEN ────────────────────────────────────────────────────────────
    function DonutChart({ title, data, size = 140 }) {
      const total = data.reduce((s, d) => s + d.value, 0);
      if (total === 0) return null;
      const cx = size / 2, cy = size / 2, r = size * 0.36, inner = size * 0.22;
      let angle = -Math.PI / 2;
      const slices = data.filter(d => d.value > 0).map(d => {
        const start = angle;
        angle += (d.value / total) * 2 * Math.PI;
        return { ...d, start, end: angle };
      });

      const arc = (s, e, ro, ri) => {
        const x1 = cx + ro * Math.cos(s), y1 = cy + ro * Math.sin(s);
        const x2 = cx + ro * Math.cos(e), y2 = cy + ro * Math.sin(e);
        const x3 = cx + ri * Math.cos(e), y3 = cy + ri * Math.sin(e);
        const x4 = cx + ri * Math.cos(s), y4 = cy + ri * Math.sin(s);
        const large = e - s > Math.PI ? 1 : 0;
        return `M ${x1} ${y1} A ${ro} ${ro} 0 ${large} 1 ${x2} ${y2} L ${x3} ${y3} A ${ri} ${ri} 0 ${large} 0 ${x4} ${y4} Z`;
      };

      return (
        <div style={{ display:'flex', flexDirection:'column', alignItems:'center', gap:10 }}>
          <div style={{ fontFamily:"'Lora',serif", fontSize:13, fontWeight:700, color:C.navy, textAlign:'center' }}>{title}</div>
          <svg width={size} height={size}>
            {slices.map((s, i) => <path key={i} d={arc(s.start, s.end, r, inner)} fill={s.color} opacity={0.9} />)}
            <text x={cx} y={cy + 4} textAnchor="middle" fontSize={size * 0.14} fontWeight="700" fill={C.navy}>{total}</text>
          </svg>
          <div style={{ display:'flex', flexDirection:'column', gap:4, width:'100%' }}>
            {data.filter(d => d.value > 0).map((d, i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:6, fontSize:11 }}>
                <div style={{ width:10, height:10, borderRadius:2, background:d.color, flexShrink:0 }} />
                <span style={{ color:C.mid, flex:1 }}>{d.label}</span>
                <span style={{ fontWeight:700, color:C.navy }}>{d.value}</span>
                <span style={{ color:C.light }}>({Math.round(d.value/total*100)}%)</span>
              </div>
            ))}
          </div>
        </div>
      );
    }

    function BarChart({ title, groups }) {

              {stakeholders.length > 0 && <DonutChart title="Reactief/Pro-actief" size={130} data={DIAG_B[1].opts.map((o,i) => ({ label:o, value:sReact[i], color:DIAG_B[1].colors[i] }))} />}
              {stakeholders.length > 0 && <DonutChart title="Toon stakeholders" size={130} data={DIAG_B[2].opts.map((o,i) => ({ label:o, value:sToon[i], color:DIAG_B[2].colors[i] }))} />}

            {/* Staafdiagram per cluster */}
            {medewerkers.length > 0 && (() => {

                    const m = medewerkers.filter(g => g.cluster === cl);

            <div style={{ display:'flex', gap:16, flexWrap:'wrap', paddingTop:12, borderTop:`1px solid ${C.border}` }}>

                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ─── NOTITIE ──────────────────────────────────────────────────────────────
    function NotitieView({ gesprekken, apiKey }) {
      const [notitie, setNotitie] = useState('');
      const [history, setHistory] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');

      const SYS = 'Je schrijft een bevindingsnotitie voor een nieuw afdelingshoofd bij OM Parket Den Haag. Schrijf in het Nederlands. Analytisch, direct, geen ambtelijke taal, geen overbodige opsmuk. Maximaal 1 A4.';

      const generate = async () => {
        if (!apiKey) { setErr('Geen API-sleutel — voeg die toe via de instellingen.'); return; }
        setLoading(true); setErr('');
        const text = gesprekken.map(gesprekToText).join('\n\n');
        const prompt = `Schrijf een bevindingsnotitie op basis van deze kennismakingsgesprekken:\n\n${text}\n\nStructuur:\n\n**Wat gaat goed** (2-3 concrete patronen)\n\n**Spanningsvelden** (4-6 specifieke fricties, geformuleerd als spanning niet als oordeel)\n\n**Wat externe stakeholders zeggen** (alleen als er stakeholdergesprekken zijn)\n\n**Conclusie en richting** (3-5 zinnen, geen oplossingen, alleen bevindingen)\n\nGeen oplossingen. Alleen bevindingen. Directe taal.`;
        try {
          const msgs = [{ role:'user', content:prompt }];
          const result = await claude(msgs, SYS, apiKey);
          setNotitie(result);
          setHistory([...msgs, { role:'assistant', content:result }]);
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      const refine = async () => {
        if (!input.trim() || !notitie || !apiKey) return;
        setLoading(true);
        const newH = [...history, { role:'user', content:input }];
        try {
          const result = await claude(newH, SYS, apiKey);
          setNotitie(result);
          setHistory([...newH, { role:'assistant', content:result }]);
          setInput('');
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      if (gesprekken.length === 0) return (
        <div style={S.empty}><div style={{ fontSize:40, marginBottom:12 }}>📝</div><div style={{ fontSize:16, fontWeight:600 }}>Nog geen gesprekken</div></div>
      );

      return (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:20 }}>
            <div>
              <div style={S.secTitle}>Bevindingsnotitie</div>
              <div style={{ fontSize:13, color:C.mid }}>Op basis van {gesprekken.length} gesprekken · max 1 A4</div>
            </div>
            <button style={S.btnP} onClick={generate} disabled={loading}>
              {loading ? <><Spinner /> Schrijven…</> : notitie ? '↻ Regenereer' : 'Genereer notitie'}
            </button>
          </div>

          {err && <div style={{ background:'#fff0f0', border:'1px solid #f5c2c2', borderRadius:8, padding:'10px 14px', fontSize:13, color:C.red, marginBottom:16 }}>{err}</div>}

          {!notitie && !loading && (
            <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:40, textAlign:'center', color:C.mid }}>
              <div style={{ fontSize:36, marginBottom:12 }}>✍️</div>
              <div style={{ fontSize:14 }}>Klik op "Genereer notitie" om een conceptbevindingsnotitie te schrijven op basis van alle gesprekken.</div>
            </div>
          )}

          {loading && <div style={{ textAlign:'center', padding:40, color:C.mid, fontSize:14 }}>Notitie wordt geschreven…</div>}

          {notitie && !loading && (
            <div className="fade-in">
              <div style={S.aiBox}>{notitie}</div>

              <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:20, marginTop:16 }}>
                <div style={{ fontFamily:"'Lora', serif", fontSize:14, fontWeight:700, color:C.navy, marginBottom:12 }}>Aanpassing of aanvulling geven</div>
                {history.filter(m => m.role==='user').slice(1).map((m,i) => (
                  <div key={i} style={{ fontSize:12, color:C.mid, padding:'6px 10px', background:C.creamDk, borderRadius:6, marginBottom:6 }}>↳ {m.content}</div>
                ))}
                <div style={{ display:'flex', gap:10 }}>
                  <input style={{ ...S.inp, flex:1 }}
                    placeholder="Bijv: 'Maak de spanningsvelden concreter' of 'Voeg iets toe over communicatie'"
                    value={input} onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && !e.shiftKey && refine()} />
                  <button style={S.btnP} onClick={refine} disabled={loading || !input.trim()}>
                    {loading ? <Spinner /> : 'Pas aan'}
                  </button>
                </div>
                <div style={{ fontSize:12, color:C.light, marginTop:8 }}>Je kunt meerdere aanpassingen doen — Claude houdt de context bij.</div>
              </div>

              <div style={{ marginTop:16, display:'flex', gap:8 }}>
                <button style={S.btnS} onClick={() => navigator.clipboard?.writeText(notitie)}>📋 Kopieer tekst</button>
                <button style={{ ...S.btnS, color:C.light, borderColor:C.border }}
                  onClick={() => { setNotitie(''); setHistory([]); }}>Wis notitie</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ─── DIAGNOSE VIEW ────────────────────────────────────────────────────────
    const BRON_SUGGESTIONS = [
      'Opdracht hoofdofficier',
      'Intranetbeschrijving afdeling',
      'Eigen bevindingen',
      'O&F-plan (samenvatting)',
      'Overig',
    ];

    function DiagnoseView({ gesprekken, bronnen, onBronnenChange, apiKey }) {
      const [diagnose, setDiagnose] = useState(() => {
        try { return localStorage.getItem('om-diagnose') || ''; } catch { return ''; }
      });
      const [history, setHistory] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');
      const [editingId, setEditingId] = useState(null);

      const saveDiagnose = (d) => {
        setDiagnose(d);
        try { localStorage.setItem('om-diagnose', d); } catch {}
      };

      const addBron = (label) => {
        const item = { id: uid(), label, tekst: '' };
        onBronnenChange([...bronnen, item]);
        setEditingId(item.id);
      };

      const pdfRef = React.useRef();

      const uploadPdf = async (e) => {
        const file = e.target.files[0];
        if (!file || !apiKey) return;
        e.target.value = '';
        const label = file.name.replace('.pdf','');
        const loadingId = uid();
        onBronnenChange(prev => [...prev, { id: loadingId, label, tekst: '⏳ PDF wordt gelezen…' }]);
        setEditingId(loadingId);

        try {
          const base64 = await new Promise((res, rej) => {
            const r = new FileReader();
            r.onload = () => res(r.result.split(',')[1]);
            r.onerror = rej;
            r.readAsDataURL(file);
          });

          const response = await fetch('https://api.anthropic.com/v1/messages', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'x-api-key': apiKey,
              'anthropic-version': '2023-06-01',
              'anthropic-dangerous-direct-browser-access': 'true',
            },
            body: JSON.stringify({
              model: 'claude-sonnet-4-5',
              max_tokens: 4000,
              messages: [{
                role: 'user',
                content: [
                  { type: 'document', source: { type: 'base64', media_type: 'application/pdf', data: base64 } },
                  { type: 'text', text: 'Extraheer de volledige tekst uit dit document. Geef alleen de tekst terug, geen commentaar of samenvatting. Behoud de structuur zo goed mogelijk.' }
                ]
              }]
            })
          });
          const data = await response.json();
          if (data.error) throw new Error(data.error.message);
          const tekst = data.content?.map(b => b.text || '').join('\n') || '';
          onBronnenChange(prev => prev.map(b => b.id === loadingId ? { ...b, tekst } : b));
        } catch(err) {
          onBronnenChange(prev => prev.map(b => b.id === loadingId ? { ...b, tekst: `Fout bij lezen PDF: ${err.message}` } : b));
        }
      };

      const updateBron = (id, field, val) => {
        onBronnenChange(bronnen.map(b => b.id === id ? { ...b, [field]: val } : b));
      };

      const removeBron = (id) => {
        if (window.confirm('Dit bronblok verwijderen?')) onBronnenChange(bronnen.filter(b => b.id !== id));
      };

      const SYS = `Je helpt een nieuw afdelingshoofd bij OM Parket Den Haag een diagnose stellen en een notitie schrijven. Schrijf in het Nederlands. Analytisch, direct, geen ambtelijke taal.

Achtergrond: het afdelingshoofd werkt volgens een gefaseerd ontwikkeltraject gebaseerd op de T&G-methodiek voor OM Parket Den Haag. De afdeling heeft vijf clusters: beleidsondersteuning & advies, gebiedsgericht werken, intelligence & ondermijning, communicatie, en bureau juridische zaken. Eén teamleider. Geen clustercoördinatoren.

Het traject kent 5 fasen:
- Fase 0: Mandate ophalen bij hoofdofficier
- Fase 1: Diagnose — kennismakingsgesprekken intern en extern, patroonanalyse, bevindingsnotitie
- Fase 2: Clusters voeren stakeholdergesprekken binnen kaders van het afdelingshoofd
- Fase 3: Afdelingsdocument — missie, leidende principes, rolverwachtingen per cluster
- Fase 4: Borging — overlegstructuur, gedragsindicatoren, bijsturing na 6 maanden

Na fase 1 volgt een DECIDE-moment met de hoofdofficier op basis van drie scenario's:
- Scenario A: volledig traject
- Scenario B: gericht traject
- Scenario C: klein traject

Analytisch kader — verwerk dit altijd in de diagnose:

1. Het probleem ligt niet alleen bij B&S maar ook bij hoe het parket B&S aanstuurt. De sturingsverantwoordelijkheid van de parketleiding is onderdeel van de diagnose — niet alleen intern falen van de afdeling. Dit krijgt een prominente positie, niet een voetnoot.

2. De volgorde is altijd: eerst definiëren waarvoor B&S bestaat (conceptueel), dan pas beoordelen of de inrichting klopt (structureel). Nooit andersom.

3. De centrale hypothese is: B&S geeft focus aan het parket — soms leidend, soms dienend. Dit is een hypothese die getoetst wordt via de gesprekken, geen vaststaande conclusie. Introduceer het niet als feit maar laat het bevestigd of ontkracht worden door wat mensen zeggen.

4. De diagnose meet effect, niet inspanning. Niet hoeveel overleggen of klachten afgehandeld — maar of het parket er beter van wordt.

5. De diagnose sluit altijd af met expliciete toetsvragen: wat moet aan het einde van fase 1 beantwoord zijn dat nu nog onbekend is?

Belangrijk: stel geen acties voor die buiten het traject vallen. De diagnose is een analysedocument, geen interventieplan.`;

      const buildPrompt = () => {
        const gesprekkenText = gesprekken.map(gesprekToText).join('\n\n');
        const bronText = bronnen.filter(b => b.tekst?.trim())
          .map(b => `=== ${b.label.toUpperCase()} ===\n${b.tekst}`).join('\n\n');

        return `Je bent een scherpe organisatieadviseur die een diagnose stelt van een afdeling bij OM Parket Den Haag. De diagnose moet eerlijk, analytisch en direct zijn — geen diplomatieke omwegen, geen actieadviezen, geen stappenplannen.

Hieronder staan gespreksnotities én aanvullende bronnen inclusief de eigen observaties van het afdelingshoofd. Eigen observaties zijn primaire input — niet een bijlage.

${gesprekkenText ? `## GESPREKSNOTITIES (${gesprekken.length} gesprekken)\n\n${gesprekkenText}` : ''}
${bronText ? `\n\n## AANVULLENDE BRONNEN EN EIGEN OBSERVATIES\n\n${bronText}` : ''}

Schrijf een diagnose. Niet een opsomming van wat mensen zeggen — maar een redenering over wat er structureel mis is en waarom. Gebruik de gesprekken en bronnen als bewijs voor de redenering, niet als inhoud op zichzelf.

Volg het analytisch kader uit de systeeminstructie. Dat betekent:
- Begin met de conceptuele vraag: waarvoor bestaat B&S?
- Geef de sturingsverantwoordelijkheid van de parketleiding een prominente positie
- Behandel de hypothese over leidend/dienend als hypothese, niet als feit
- Meet effect, niet inspanning

**Wat structureel niet klopt**
Benoem 3-5 fundamentele disfuncties met oorzaken. Wat ontbreekt, wat klopt niet in de inrichting, wat werkt structureel tegen — inclusief de rol van de parketleiding daarin?

**De paradoxen**
Benoem 2-3 spanningen die de kern van het probleem raken.

**Wat dit zegt over de afdeling als geheel**
Dominante patroon, cultuur, hoe de afdeling zichzelf positioneert.

**Kern van de opgave**
4-6 zinnen. Wat is de werkelijke diagnose?

**Toetsvragen voor fase 1**
Wat moet nog beantwoord worden voor het DECIDE-moment? Formuleer als open vragen, niet als acties.

Geen actiepunten. Geen "ga met X in gesprek". Dit is een diagnose.`;
      };

      const generate = async () => {
        if (!apiKey) { setErr('Geen API-sleutel — voeg die toe via de instellingen.'); return; }
        if (gesprekken.length === 0 && bronnen.filter(b => b.tekst?.trim()).length === 0) {
          setErr('Voeg eerst gesprekken of bronnen toe.'); return;
        }
        setLoading(true); setErr('');
        try {
          const prompt = buildPrompt();
          const msgs = [{ role:'user', content: prompt }];
          const result = await claude(msgs, SYS, apiKey);
          saveDiagnose(result);
          setHistory([...msgs, { role:'assistant', content: result }]);
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      const [chatHistory, setChatHistory] = useState([]);
      const [chatLoading, setChatLoading] = useState(false);

      const chat = async () => {
        if (!input.trim() || !diagnose || !apiKey) return;
        setChatLoading(true);
        const vraag = input;
        const contextMsg = { role:'user', content: `De huidige diagnose is:\n\n${diagnose}\n\nVraag: ${vraag}` };
        try {
          const result = await claude([contextMsg], SYS, apiKey);
          setChatHistory(prev => [...prev, { id: uid(), vraag, antwoord: result }]);
          setInput('');
        } catch(e) { setErr(e.message); }
        setChatLoading(false);
      };

      const incorporeer = async (antwoord, itemId) => {
        setLoading(true);
        const prompt = `Dit is de huidige diagnose:\n\n${diagnose}\n\nDit is een aanvulling of correctie die verwerkt moet worden:\n\n${antwoord}\n\nPas de diagnose gericht aan op basis van deze aanvulling. Herschrijf alleen wat relevant verandert — behoud de rest zoals het is. Geen nieuwe structuur, geen nieuwe opzet.`;
        try {
          const result = await claude([{ role:'user', content: prompt }], SYS, apiKey);
          saveDiagnose(result);
          setChatHistory(prev => prev.filter(item => item.id !== itemId));
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      const wis = () => {
        if (window.confirm('Diagnose wissen? De bronnen blijven bewaard.')) {
          saveDiagnose(''); setHistory([]); setChatHistory([]);
        }
      };

      const totalBronChars = bronnen.reduce((n, b) => n + (b.tekst?.length || 0), 0);

      return (
        <div>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:20 }}>
            <div>
              <div style={S.secTitle}>Diagnose</div>
              <div style={{ fontSize:13, color:C.mid }}>
                {gesprekken.length} gesprekken · {bronnen.length} bronnen · {totalBronChars > 0 ? `${totalBronChars} tekens` : 'geen extra tekst'}
              </div>
            </div>
            <div style={{ display:'flex', gap:8 }}>
              {diagnose && <button style={{ ...S.btnS, color:C.red, borderColor:C.red }} onClick={wis}>Wis diagnose</button>}
              <button style={S.btnP} onClick={generate} disabled={loading}>
                {loading ? <><Spinner /> Bezig…</> : diagnose ? '↻ Opnieuw' : '🔍 Maak diagnose'}
              </button>
            </div>
          </div>

          {err && <div style={{ background:'#fff0f0', border:'1px solid #f5c2c2', borderRadius:8, padding:'10px 14px', fontSize:13, color:C.red, marginBottom:16 }}>{err}</div>}

          {/* Bronnen sectie */}
          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, marginBottom:20, overflow:'hidden' }}>
            <div style={{ background:C.navyDk, padding:'12px 18px', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
              <span style={{ fontFamily:"'Lora',serif", fontSize:14, fontWeight:700, color:C.white }}>Bronnen</span>
              <span style={{ fontSize:11, color:'rgba(255,255,255,0.5)' }}>naast de gesprekken</span>
            </div>
            <div style={{ padding:'16px 18px' }}>
              {bronnen.length === 0 && (
                <div style={{ fontSize:13, color:C.light, marginBottom:14, fontStyle:'italic' }}>
                  Nog geen bronnen — de diagnose gebruikt alleen de gesprekken. Voeg extra context toe om de diagnose te verrijken.
                </div>
              )}
              {bronnen.map(b => (
                <div key={b.id} style={{ border:`1px solid ${editingId===b.id ? C.navy : C.border}`, borderRadius:8, padding:14, marginBottom:10, boxShadow: editingId===b.id ? `0 0 0 3px rgba(26,48,87,0.1)` : 'none' }}>
                  <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8 }}>
                    <input style={{ ...S.inp, fontWeight:600, fontSize:13, color:C.navy, border:'none', padding:0, background:'transparent', flex:1 }}
                      value={b.label} onChange={e => updateBron(b.id,'label',e.target.value)} onFocus={() => setEditingId(b.id)} />
                    <button onClick={() => removeBron(b.id)} style={{ background:'none', border:'none', cursor:'pointer', color:C.light, fontSize:18, padding:'0 4px', lineHeight:1 }}>×</button>
                  </div>
                  <textarea style={{ ...S.ta, minHeight:100 }} placeholder="Plak of typ hier de tekst…"
                    value={b.tekst||''} onChange={e => updateBron(b.id,'tekst',e.target.value)} onFocus={() => setEditingId(b.id)} />
                  {b.tekst && <div style={{ fontSize:11, color:C.light, marginTop:3, textAlign:'right' }}>{b.tekst.length} tekens</div>}
                </div>
              ))}
              <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginTop:4 }}>
                {BRON_SUGGESTIONS.map(s => (
                  <button key={s} onClick={() => addBron(s)}
                    style={{ padding:'6px 12px', borderRadius:20, border:`1.5px solid ${C.navyLt}`, background:C.white, color:C.navyLt, fontSize:11, fontWeight:600, cursor:'pointer' }}>
                    + {s}
                  </button>

                <button onClick={() => addBron('Eigen label')}
                  style={{ padding:'6px 12px', borderRadius:20, border:`1.5px solid ${C.border}`, background:C.white, color:C.mid, fontSize:11, cursor:'pointer' }}>
                  + Eigen label
                </button>
                <button onClick={() => pdfRef.current.click()}
                  style={{ padding:'6px 12px', borderRadius:20, border:`1.5px solid ${C.orange}`, background:C.white, color:C.orange, fontSize:11, fontWeight:600, cursor:'pointer' }}>
                  📄 Upload PDF
                </button>
                <input ref={pdfRef} type="file" accept="application/pdf" style={{ display:'none' }} onChange={uploadPdf} />
              </div>
            </div>
          </div>

          {/* Diagnose resultaat */}
          {!diagnose && !loading && (
            <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:40, textAlign:'center', color:C.mid }}>
              <div style={{ fontSize:36, marginBottom:12 }}>🔍</div>
              <div style={{ fontSize:14, fontWeight:600, marginBottom:6 }}>Nog geen diagnose</div>
              <div style={{ fontSize:13 }}>Voeg bronnen toe (optioneel) en klik op "Maak diagnose".<br/>Claude combineert de gesprekken en bronnen tot een diagnose.</div>
            </div>
          )}

          {loading && <div style={{ textAlign:'center', padding:40, color:C.mid, fontSize:14 }}>Diagnose wordt gemaakt…</div>}

          {diagnose && !loading && (
            <div className="fade-in">
              <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, overflow:'hidden', marginBottom:16 }}>
                <div style={{ background:C.navy, padding:'12px 18px' }}>
                  <span style={{ fontFamily:"'Lora',serif", fontSize:14, fontWeight:700, color:C.white }}>Diagnose</span>
                </div>
                <div style={{ ...S.aiBox, borderRadius:0, border:'none' }}>{diagnose}</div>
              </div>


              {/* Chat */}
              <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:18, marginBottom:16 }}>
                <div style={{ fontFamily:"'Lora',serif", fontSize:13, fontWeight:700, color:C.navy, marginBottom:12 }}>Stel een vraag over de diagnose</div>

                {chatHistory.length > 0 && (
                  <div style={{ marginBottom:14, display:'flex', flexDirection:'column', gap:12 }}>
                    {chatHistory.map((item, i) => (
                      <div key={i}>
                        <div style={{ fontSize:12, fontWeight:600, color:C.navy, background:C.creamDk, padding:'7px 12px', borderRadius:'8px 8px 0 0' }}>
                          ↗ {item.vraag}
                        </div>
                        <div style={{ fontSize:13, color:C.text, background:'#F8F7F3', padding:'10px 12px', borderRadius:'0 0 8px 8px', lineHeight:1.65, whiteSpace:'pre-wrap', borderLeft:`3px solid ${C.navyLt}` }}>
                          {item.antwoord}
                        </div>
                        <div style={{ display:'flex', gap:8, marginTop:6 }}>
                          <button onClick={() => incorporeer(item.antwoord, item.id)} disabled={loading}
                            style={{ ...S.btnS, fontSize:11, padding:'5px 12px', color:C.green, borderColor:C.green }}>
                            {loading ? <Spinner /> : '↳ Verwerk in diagnose'}
                          </button>
                          <button onClick={() => setChatHistory(prev => prev.filter(c => c.id !== item.id))}
                            style={{ background:'none', border:'none', cursor:'pointer', fontSize:11, color:C.light }}>
                            verwijder
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                )}

                <div style={{ display:'flex', gap:8 }}>
                  <input style={{ ...S.inp, flex:1 }}
                    placeholder="Bijv: 'Wat zegt dit over I&O?' of 'Ontbreekt er iets in de analyse?'"
                    value={input} onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key==='Enter' && !e.shiftKey && chat()} />
                  <button style={S.btnP} onClick={chat} disabled={chatLoading || !input.trim()}>
                    {chatLoading ? <Spinner /> : 'Vraag'}
                  </button>
                </div>
                <div style={{ fontSize:11, color:C.light, marginTop:6 }}>Antwoord verschijnt hier — de diagnose blijft ongewijzigd totdat je kiest voor "Verwerk in diagnose".</div>
              </div>

              <div style={{ display:'flex', gap:8 }}>
                <button style={S.btnS} onClick={() => navigator.clipboard?.writeText(diagnose)}>📋 Kopieer</button>
                <button style={{ ...S.btnS, color:C.light, borderColor:C.border }} onClick={wis}>Wis diagnose</button>
              </div>

              {/* ── Notitie op basis van diagnose ── */}
              <DiagnoseNotitie diagnose={diagnose} apiKey={apiKey} />
            </div>
          )}
        </div>
      );
    }

    function DiagnoseNotitie({ diagnose, apiKey }) {
      const [notitie, setNotitie] = useState(() => {
        try { return localStorage.getItem('om-diagnose-notitie') || ''; } catch { return ''; }
      });
      const [history, setHistory] = useState([]);
      const [input, setInput] = useState('');
      const [loading, setLoading] = useState(false);
      const [err, setErr] = useState('');
      const [open, setOpen] = useState(false);

      const saveNotitie = (n) => {
        setNotitie(n);
        try { localStorage.setItem('om-diagnose-notitie', n); } catch {}
      };

      const SYS_NOTITIE = `Je schrijft een bevindingsnotitie voor een nieuw afdelingshoofd bij OM Parket Den Haag. Schrijf in het Nederlands. Analytisch, direct, geen ambtelijke taal, geen overbodige opsmuk. Maximaal 1 A4.

De notitie volgt altijd deze volgorde: eerst het conceptuele (waarvoor bestaat B&S), dan pas het structurele (of de inrichting klopt). Niet andersom.

De sturingsverantwoordelijkheid van de parketleiding krijgt een prominente positie — dit is geen puur intern probleem van B&S. Het parket heeft nagelaten te sturen op samenhang en aansluiting. Dat is onderdeel van de bevinding.

De notitie onderscheidt expliciet waar B&S leidend moet zijn (verwerving, woordvoering, informatiesturing) en waar dienend (klachtafhandeling, bestuursondersteuning, advies op verzoek). Zolang dat onderscheid niet gemaakt is, blijft de afdeling standaard reactief.

De notitie sluit af met de vraag wat nog getoetst moet worden voor het DECIDE-moment met de hoofdofficier — niet als actielijst maar als open vragen die fase 1 moet beantwoorden.

Geen actiepunten. Geen stappenplannen. Alleen bevindingen.`;

      const generate = async () => {
        if (!apiKey) { setErr('Geen API-sleutel.'); return; }
        setLoading(true); setErr(''); setOpen(true);
        try {
          const msgs = [{ role:'user', content:`Schrijf een scherpe, compacte notitie op basis van deze diagnose:\n\n${diagnose}\n\nDe notitie is een sturingsinstrument voor het afdelingshoofd zelf en als basis voor het DECIDE-gesprek met de hoofdofficier aan het einde van fase 1. Het is geen actieplan en geen stappenplan.\n\nStructuur:\n\n**De kern** (3-4 zinnen — wat is de essentie van de problematiek, direct geformuleerd)\n\n**Wat structureel anders moet** (4-6 punten — niet hoe, maar wat de gewenste toestand is per gebied)\n\n**Wat dit vraagt van de afdeling** (wat moet er anders in hoe de afdeling als geheel functioneert — cultuur, houding, werkwijze)\n\n**Wat dit van mij vraagt als afdelingshoofd** (wat is mijn rol, waar moet ik op sturen, wat vraagt dit van mijn leiderschap)\n\n**Wat ik daarvoor nodig heb** (van het parket, van de parketleiding, van andere afdelingen en leidinggevenden — wat is noodzakelijk om dit te kunnen realiseren)\n\n**Scenario-advies** (op basis van de diagnose: past scenario A, B of C het beste, en waarom — dit is input voor het gesprek met de hoofdofficier, geen opdracht aan hem)\n\nMaximaal 1,5 A4. Analytisch, direct, geen ambtelijke taal. Geen actielijsten.` }];
          const result = await claude(msgs, SYS_NOTITIE, apiKey);
          saveNotitie(result);
          setHistory([...msgs, { role:'assistant', content:result }]);
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      const refine = async () => {
        if (!input.trim() || !notitie || !apiKey) return;
        setLoading(true);
        const newH = [...history, { role:'user', content:input }];
        try {
          const result = await claude(newH, SYS_NOTITIE, apiKey);
          saveNotitie(result);
          setHistory([...newH, { role:'assistant', content:result }]);
          setInput('');
        } catch(e) { setErr(e.message); }
        setLoading(false);
      };

      return (
        <div style={{ marginTop:24 }}>
          <div style={{ background:C.navyDk, borderRadius:10, overflow:'hidden' }}>
            <div style={{ padding:'14px 18px', display:'flex', justifyContent:'space-between', alignItems:'center', cursor:'pointer' }}
              onClick={() => setOpen(o => !o)}>
              <span style={{ fontFamily:"'Lora',serif", fontSize:14, fontWeight:700, color:C.white }}>
                Notitie op basis van diagnose
              </span>
              <div style={{ display:'flex', gap:8, alignItems:'center' }}>
                {notitie && <span style={{ fontSize:10, color:'rgba(255,255,255,0.5)' }}>opgeslagen</span>}
                <button style={{ ...S.btnP, padding:'6px 14px', fontSize:12 }}
                  onClick={e => { e.stopPropagation(); generate(); }} disabled={loading}>
                  {loading ? <Spinner /> : notitie ? '↻ Opnieuw' : 'Maak notitie'}
                </button>
                <span style={{ color:'rgba(255,255,255,0.5)', fontSize:16 }}>{open ? '−' : '+'}</span>
              </div>
            </div>

            {open && (
              <div style={{ padding:'0 18px 18px' }} className="fade-in">
                {err && <div style={{ fontSize:13, color:'#f5a0a0', marginBottom:10 }}>{err}</div>}

                {!notitie && !loading && (
                  <div style={{ fontSize:13, color:'rgba(255,255,255,0.4)', fontStyle:'italic', padding:'10px 0' }}>
                    Klik op "Maak notitie" — Claude vertaalt de diagnose naar een compacte actienotitie.
                  </div>
                )}
                {loading && <div style={{ fontSize:13, color:'rgba(255,255,255,0.5)', padding:'10px 0' }}>Notitie wordt geschreven…</div>}

                {notitie && !loading && (
                  <>
                    <div style={{ ...S.aiBox, background:'rgba(255,255,255,0.05)', border:'1px solid rgba(255,255,255,0.1)', color:C.white, marginBottom:14 }}>{notitie}</div>

                    <div style={{ display:'flex', gap:8, marginBottom:12 }}>
                      <input style={{ ...S.inp, flex:1, background:'rgba(255,255,255,0.08)', border:'1px solid rgba(255,255,255,0.15)', color:C.white }}
                        placeholder="Bijv: 'Maak de eerste acties concreter' of 'Kort in tot een halve A4'"
                        value={input} onChange={e => setInput(e.target.value)}
                        onKeyDown={e => e.key==='Enter' && !e.shiftKey && refine()} />
                      <button style={S.btnP} onClick={refine} disabled={loading || !input.trim()}>
                        {loading ? <Spinner /> : 'Stuur'}
                      </button>
                    </div>
                    {history.filter(m => m.role==='user').slice(1).map((m,i) => (
                      <div key={i} style={{ fontSize:11, color:'rgba(255,255,255,0.4)', padding:'4px 8px', background:'rgba(255,255,255,0.05)', borderRadius:5, marginBottom:4 }}>↳ {m.content}</div>
                    ))}

                    <div style={{ display:'flex', gap:8, marginTop:8 }}>
                      <button style={{ ...S.btnS, borderColor:'rgba(255,255,255,0.3)', color:'rgba(255,255,255,0.7)' }}
                        onClick={() => navigator.clipboard?.writeText(notitie)}>📋 Kopieer</button>
                      <button style={{ ...S.btnS, borderColor:'rgba(255,255,255,0.15)', color:'rgba(255,255,255,0.4)' }}
                        onClick={() => { saveNotitie(''); setHistory([]); }}>Wis notitie</button>
                    </div>
                  </>
                )}
              </div>
            )}
          </div>
        </div>
      );
    }

    // ─── INSTELLINGEN ─────────────────────────────────────────────────────────
    function InstellingenView({ apiKey, onSaveKey, gesprekken, bronnen, onImport }) {
      const [key, setKey] = useState(apiKey);
      const [saved, setSaved] = useState(false);
      const [importErr, setImportErr] = useState('');
      const [importOk, setImportOk] = useState('');
      const fileRef = React.useRef();

      const save = () => { onSaveKey(key); setSaved(true); setTimeout(() => setSaved(false), 2000); };

      const exportData = () => {
        const data = { versie: 1, datum: new Date().toISOString(), gesprekken, bronnen };
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `om-gesprekken-${new Date().toISOString().slice(0,10)}.json`;
        a.click();
        URL.revokeObjectURL(url);
      };

      const importData = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (ev) => {
          try {
            const data = JSON.parse(ev.target.result);
            if (!data.gesprekken) throw new Error('Ongeldig bestand');
            onImport(data);
            setImportErr('');
            setImportOk(`${data.gesprekken.length} gesprekken en ${(data.bronnen||[]).length} bronnen teruggezet.`);
            setTimeout(() => setImportOk(''), 4000);
          } catch {
            setImportErr('Ongeldig bestand — controleer of je het juiste JSON-bestand uploadt.');
          }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      return (
        <div>
          <div style={S.secTitle}>Instellingen</div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:20 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:6 }}>Back-up</div>
            <div style={{ fontSize:13, color:C.mid, marginBottom:16 }}>
              Exporteer alle gesprekken en bronnen als JSON. Bewaar dit op een veilige plek — je kunt het altijd terugzetten, ook na een URL-wijziging of herinstallatie.
            </div>
            <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
              <button style={S.btnP} onClick={exportData}>⬇ Exporteer ({gesprekken.length} gesprekken)</button>
              <button style={S.btnS} onClick={() => fileRef.current.click()}>⬆ Importeer back-up</button>
              <input ref={fileRef} type="file" accept=".json" style={{ display:'none' }} onChange={importData} />
            </div>
            {importOk && <div style={{ fontSize:13, color:C.green, marginTop:10, fontWeight:600 }}>✓ {importOk}</div>}
            {importErr && <div style={{ fontSize:13, color:C.red, marginTop:10 }}>{importErr}</div>}
          </div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:16 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:16 }}>API-sleutel</div>
            <label style={S.label}>Anthropic API-sleutel</label>
            <input style={{ ...S.inp, fontFamily:'monospace', fontSize:13, marginBottom:8 }}
              type="password" placeholder="sk-ant-..." value={key} onChange={e => setKey(e.target.value)} />
            <div style={{ fontSize:12, color:C.light, marginBottom:16 }}>
              Haal je sleutel op via <a href="https://console.anthropic.com" target="_blank" style={{ color:C.navyLt }}>console.anthropic.com</a>
            </div>
            <button style={S.btnP} onClick={save}>{saved ? '✓ Opgeslagen' : 'Sleutel opslaan'}</button>
          </div>

          <div style={{ background:C.white, border:`1px solid ${C.border}`, borderRadius:10, padding:24, marginTop:16 }}>
            <div style={{ fontFamily:"'Lora',serif", fontSize:15, fontWeight:700, color:C.navy, marginBottom:16 }}>Gegevens</div>
            <div style={{ fontSize:14, color:C.mid, marginBottom:16 }}>{gesprekken.length} gesprekken · {bronnen.length} bronnen in lokale opslag.</div>
            <button style={{ ...S.btnS, color:C.red, borderColor:C.red }}
              onClick={() => { if(window.confirm('Alle gesprekken, bronnen en diagnose definitief verwijderen?')) { localStorage.removeItem('om-gesprekken'); localStorage.removeItem('om-context'); localStorage.removeItem('om-diagnose'); window.location.reload(); } }}>
              Alle gegevens verwijderen
            </button>
          </div>
        </div>
      );
    }

    // ─── MAIN APP ─────────────────────────────────────────────────────────────
    function App() {
      const [apiKey, setApiKeyState] = useState(() => store.getApiKey());
      const [showSetup, setShowSetup] = useState(() => !store.getApiKey());
      const [view, setView] = useState('gesprekken');
      const [gesprekken, setGesprekken] = useState(() => store.loadGesprekken());
      const [bronnen, setBronnen] = useState(() => store.loadContext());
      const [editingId, setEditingId] = useState(null);

      useEffect(() => { store.saveGesprekken(gesprekken); }, [gesprekken]);
      useEffect(() => { store.saveContext(bronnen); }, [bronnen]);

      const handleImport = useCallback((data) => {
        setGesprekken(data.gesprekken || []);
        setBronnen(data.bronnen || []);
      }, []);

      const handleSaveKey = (k) => { store.setApiKey(k); setApiKeyState(k); setShowSetup(false); };
      const handleSave = useCallback((data) => {
        if (editingId) setGesprekken(prev => prev.map(g => g.id===editingId ? { ...data, id:editingId } : g));
        else setGesprekken(prev => [...prev, { ...data, id:uid() }]);
        setEditingId(null); setView('gesprekken');
      }, [editingId]);

      if (showSetup) return <SetupView onSave={handleSaveKey} />;

      const navItems = [
        { id:'gesprekken',   label:'Gesprekken',   },
        { id:'patronen',     label:'Patronen',     },
        { id:'diagnose',     label:'Diagnose',     },
        { id:'notitie',      label:'Notitie',      },
        { id:'instellingen', label:'Instellingen', },
      ];

      return (
        <div style={S.app}>
          <header style={S.hdr}>
            <div style={S.hdrIn}>
              <div>
                <div style={S.title}>OM Gesprekken</div>
                <div style={S.sub}>{gesprekken.length} gesprekken · {gesprekken.filter(g=>g.type==='medewerker').length}M · {gesprekken.filter(g=>g.type==='stakeholder').length}S · {gesprekken.filter(g=>g.type==='parketleiding').length}PL{bronnen.length > 0 ? ` · ${bronnen.length} bronnen` : ''}</div>
              </div>
              {view !== 'form' && (
                <nav style={S.nav}>
                  {navItems.map(n => (
                    <button key={n.id} style={S.navBtn(view===n.id)} onClick={() => setView(n.id)}>
                      {n.label}
                    </button>
                  ))}
                </nav>
              )}
            </div>
          </header>
          <main style={S.main}>
            {view==='gesprekken' && <GesprekkenView gesprekken={gesprekken} onNew={() => { setEditingId(null); setView('form'); }} onEdit={id => { setEditingId(id); setView('form'); }} onDelete={id => setGesprekken(prev => prev.filter(g => g.id!==id))} />}
            {view==='form' && <FormView gesprek={editingId ? gesprekken.find(g=>g.id===editingId) : null} onSave={handleSave} onCancel={() => { setEditingId(null); setView('gesprekken'); }} />}
            {view==='patronen' && <PatronenView gesprekken={gesprekken} apiKey={apiKey} />}
            {view==='diagnose' && <DiagnoseView gesprekken={gesprekken} bronnen={bronnen} onBronnenChange={setBronnen} apiKey={apiKey} />}
            {view==='notitie' && <NotitieView gesprekken={gesprekken} apiKey={apiKey} />}
            {view==='instellingen' && <InstellingenView apiKey={apiKey} onSaveKey={handleSaveKey} gesprekken={gesprekken} bronnen={bronnen} onImport={handleImport} />}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
